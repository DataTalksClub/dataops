AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DataTalksClub DataOps v1 protected Lambda app

Parameters:
  KnowledgeBucketName:
    Type: String
    Default: dataops-knowledge-source-817685572750-eu-west-1
  KnowledgeBackupBucketName:
    Type: String
    Default: dataops-knowledge-protected-817685572750-eu-west-1
  GitHubOwner:
    Type: String
    Default: DataTalksClub
  GitHubRepo:
    Type: String
    Default: dataops-knowledge
    Description: >-
      Private daily mirror repository. Application knowledge is authoritative in S3.
  GitHubBranch:
    Type: String
    Default: main
  GitHubTokenSecretName:
    Type: String
    Default: dataops-v1/knowledge/github-token
    Description: >-
      Secrets Manager token used exclusively by the daily knowledge mirror worker.
  AuthBaseUrl:
    Type: String
    Default: https://auth.dtcdev.click
  AuthUserPoolId:
    Type: String
    Default: us-east-1_H7nJu52Bs
  AuthIssuer:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_H7nJu52Bs
  AuthJwksUrl:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_H7nJu52Bs/.well-known/jwks.json
  AuthClientId:
    Type: String
    Default: 1kjv61esdjs3003s8u42sgr3hf
  AuthCallbackUrl:
    Type: String
    Default: https://ops.dtcdev.click/auth/callback
  AuthLogoutUrl:
    Type: String
    Default: https://ops.dtcdev.click/
  AuthSessionLifetimeSeconds:
    Type: Number
    Default: 2592000
    MinValue: 300
    MaxValue: 2592000
  SponsorFinanceEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  DataOpsEnvironment:
    Type: String
    Default: sandbox
    AllowedValues: ["sandbox"]
  BackendTargetFunctionName:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9-_]{1,64}$"
  ExportArchivePrefix:
    Type: String
    Default: execution-exports
    AllowedPattern: "^[a-zA-Z0-9_.\\/-]+$"
  ExportArchiveRetentionDays:
    Type: Number
    Default: 365
    MinValue: 90
  DynamoBackupPrefix:
    Type: String
    Default: dynamo-backups
    AllowedPattern: "^[a-zA-Z0-9_.\\/-]+$"
  DynamoBackupRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30
  DynamoPitrAlertEmail:
    Type: String
    Default: dev@dtcdev.click
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Mailbox paged when the daily PITR guard finds DynamoDB point-in-time recovery disabled.
  InvoicePublicationConfig:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional base64-encoded private JSON broker and invoice destination configuration
  InvoiceReaderTokenSha256:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: "^([a-f0-9]{64})?$"
    Description: SHA256 digest of the deployment-managed read-only invoice service credential; empty disables access
  EmailDocumentIntakeSecretArn:
    Type: String
    Description: ARN of the pre-created email document intake secret
    AllowedPattern: "^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  EmailDocumentSourcePrefix:
    Type: String
    Default: transfer/
    AllowedPattern: "^[a-zA-Z0-9_.\/-]+/$"
  EmailDocumentExternalSourceBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional explicit same/cross-account private transfer source bucket
  EmailDocumentExternalSourcePrefix:
    Type: String
    Default: transfer/
    AllowedPattern: "^[a-zA-Z0-9_.\/-]+/$"
  EmailDocumentExternalSourceKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$"
    Description: Optional customer-managed KMS key ARN for the explicit source
  EmailDocumentDestinationPrefix:
    Type: String
    Default: artifacts/
    AllowedPattern: "^[a-zA-Z0-9_.\/-]+/$"
  EmailDocumentRecipientRoutes:
    Type: String
    Default: invoice,receipts,invoice-attachment,invoice-pdf,todo
    AllowedPattern: "^[a-z0-9_-]+(,[a-z0-9_-]+)*$"
  EmailDocumentRateLimit:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 10000
  NewsletterOpenAlertLeadDays:
    Type: Number
    Default: 14
    MinValue: 0
    MaxValue: 365
  NewsletterWorkflowAlertLeadDays:
    Type: Number
    Default: 10
    MinValue: 0
    MaxValue: 365
  SponsorCommunicationSendEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deployment kill switch. Keep false until every human release gate passes.
  SponsorCommunicationTemplateSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  SponsorCommunicationHmacSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  SponsorCommunicationPrivateArchivePrefix:
    Type: String
    Default: sponsor-communications
    AllowedPattern: "^[A-Za-z0-9_.\\/-]+$"
Rules:
  SponsorSendRequiresPrivateConfiguration:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref SponsorCommunicationSendEnabled, "false"]
          - !And
              - !Not [!Equals [!Ref SponsorCommunicationTemplateSecretArn, ""]]
              - !Not [!Equals [!Ref SponsorCommunicationHmacSecretArn, ""]]
        AssertDescription: Sponsor sending requires separate pre-created template and HMAC secret ARNs
Conditions:
  HasInvoicePublicationConfig: !Not [!Equals [!Ref InvoicePublicationConfig, ""]]
  HasEmailDocumentExternalSource: !Not [!Equals [!Ref EmailDocumentExternalSourceBucketName, ""]]
  HasEmailDocumentExternalSourceKms: !Not [!Equals [!Ref EmailDocumentExternalSourceKmsKeyArn, ""]]
  HasSponsorTemplateSecret: !Not [!Equals [!Ref SponsorCommunicationTemplateSecretArn, ""]]
  HasSponsorHmacSecret: !Not [!Equals [!Ref SponsorCommunicationHmacSecretArn, ""]]
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 60
    MemorySize: 1024
    Architectures:
      - x86_64

Resources:
  InvoicePublicationSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasInvoicePublicationConfig
    Properties:
      Name: !Sub ${AWS::StackName}/invoice-publication
      Description: Scoped broker credential and private invoice destinations
      SecretString: !Ref InvoicePublicationConfig
  ConversationalRolloutAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-conversational-rollout-alarms
      KmsMasterKeyId: alias/aws/sns

  DynamoPitrAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-dynamo-pitr-alarms
      KmsMasterKeyId: alias/aws/sns

  DynamoPitrAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DynamoPitrAlarmTopic
      Protocol: email
      Endpoint: !Ref DynamoPitrAlertEmail

  ConversationalBackendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /dataops/${AWS::StackName}/conversational/backend
      RetentionInDays: 30

  DataOpsCalendarTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-calendar
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
  DataOpsNewsletterSlotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-newsletter-slots
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: rangeKey, AttributeType: S }
        - { AttributeName: publicationKey, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI-Date
          KeySchema:
            - { AttributeName: rangeKey, KeyType: HASH }
            - { AttributeName: publicationKey, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
  DataOpsPodcastEpisodesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-podcast-episodes
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: rangeKey, AttributeType: S }
        - { AttributeName: dateKey, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI-Date
          KeySchema:
            - { AttributeName: rangeKey, KeyType: HASH }
            - { AttributeName: dateKey, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateExecutionState }
  DataOpsPeopleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-people
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateExecutionState }
  DataOpsBooksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-books
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateExecutionState }
  DataOpsSponsorCrmTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-sponsor-crm
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expiresAt
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI4PK, AttributeType: S }
        - { AttributeName: GSI4SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI-Communication
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI-SponsorSendDue
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI-SponsorBookingCommunication
          KeySchema:
            - { AttributeName: GSI4PK, KeyType: HASH }
            - { AttributeName: GSI4SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  DataOpsBookkeepingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-bookkeeping
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  BookkeepingDocumentsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  BookkeepingDocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt BookkeepingDocumentsKey.Arn }
            BucketKeyEnabled: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: RetainNoncurrentEvidence
            Status: Enabled
            NoncurrentVersionTransitions: [{ StorageClass: GLACIER, TransitionInDays: 90 }]

  BookkeepingDocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BookkeepingDocumentsBucket
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt BookkeepingDocumentsBucket.Arn, !Sub "${BookkeepingDocumentsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": false } }

  TaskFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: RetainNoncurrentProofs
            Status: Enabled
            NoncurrentVersionTransitions: [{ StorageClass: GLACIER, TransitionInDays: 90 }]

  TaskFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TaskFilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt TaskFilesBucket.Arn, !Sub "${TaskFilesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": false } }

  EmailDocumentsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  EmailDocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt EmailDocumentsKey.Arn }
            BucketKeyEnabled: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: RetainNoncurrentDocuments
            Status: Enabled
            NoncurrentVersionTransitions: [{ StorageClass: GLACIER, TransitionInDays: 90 }]

  EmailDocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EmailDocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt EmailDocumentsBucket.Arn, !Sub "${EmailDocumentsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": false } }

  DataOpsTasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-tasks
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: cardId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI-Date
          KeySchema:
            - AttributeName: date
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-Card
          KeySchema:
            - AttributeName: cardId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-Status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionState

  DataOpsCardsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-cards
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionState

  DataOpsTemplatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-templates
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionState

  DataOpsUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
