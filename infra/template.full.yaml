  ConversationalExecutionFailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateExecutionFailure }

  ConversationalExecutionWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/execution-worker-handler.handler
      Timeout: 30
      MemorySize: 512
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ConversationalExecutionLogGroup
      Environment:
        Variables:
          DATAOPS_ENV: !Ref DataOpsEnvironment
          DATAOPS_CONVERSATIONAL_STATE_TABLE: !Ref DataOpsConversationalStateTable
          DATAOPS_USERS_TABLE: !Ref DataOpsUsersTable
          DATAOPS_TASKS_TABLE: !Ref DataOpsTasksTable
          CONVERSATIONAL_EXECUTION_LEASE_SECONDS: !Ref ConversationalExecutionLeaseSeconds
          CONVERSATIONAL_EXECUTION_DEADLINE_MS: !Ref ConversationalExecutionDeadlineMs
          CONVERSATIONAL_EXECUTION_MAX_PRE_DISPATCH_LEASES: !Ref ConversationalExecutionMaxPreDispatchLeases
          CONVERSATIONAL_EXECUTION_RECOVERY_LIMIT: !Ref ConversationalExecutionRecoveryLimit
          CONVERSATIONAL_FAKE_EXECUTOR_ENABLED: "false"
          CONVERSATIONAL_TELEGRAM_INGRESS_ENABLED: !Ref ConversationalTelegramIngressEnabled
          CONVERSATIONAL_EXECUTION_ENABLED: !Ref ConversationalExecutionEnabled
          CONVERSATIONAL_ENABLED_PLUGINS: !Ref ConversationalEnabledPlugins
          CONVERSATIONAL_TYPEFULLY_EXTERNAL_EXECUTION_ENABLED: !Ref ConversationalTypefullyExternalExecutionEnabled
          CONVERSATIONAL_TELEGRAM_VOICE_ENABLED: !Ref ConversationalTelegramVoiceEnabled
          CONVERSATIONAL_TELEGRAM_PHOTO_ENABLED: !Ref ConversationalTelegramPhotoEnabled
          CONVERSATIONAL_TYPEFULLY_ACCOUNT_CONFIG_DIGEST: !Ref ConversationalTypefullyAccountConfigDigest
          TYPEFULLY_ACCOUNT_CONFIG_REVISION: !Ref TypefullyAccountConfigRevision
          TYPEFULLY_BASE_URL: !Ref TypefullyBaseUrl
          TYPEFULLY_API_KEY_SECRET_NAME: !Ref WorkEngineTypefullyApiTokenSecretArn
          TYPEFULLY_SOCIAL_SET_ALEXEY: !Ref TypefullySocialSetAlexey
          TYPEFULLY_SOCIAL_SET_DATATALKSCLUB: !Ref TypefullySocialSetDataTalksClub
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt DataOpsConversationalStateTable.Arn
              - !Sub ${DataOpsConversationalStateTable.Arn}/index/GSI1
              - !Sub ${DataOpsConversationalStateTable.Arn}/index/GSI2
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt DataOpsTasksTable.Arn
        - Statement:
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ConversationalExecutionFailureQueue.Arn
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WorkEngineTypefullyApiTokenSecretArn
      Events:
        QueuedAttemptStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt DataOpsConversationalStateTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt ConversationalExecutionFailureQueue.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"recordType":{"S":["execution_attempt"]},"status":{"S":["queued"]}}}}'
        ExecutionRecovery:
          Type: Schedule
          Properties:
            Description: Recover due conversational execution attempts through the indexed worker path.
            Schedule: rate(2 minutes)
            State: !If [ConversationalExecutionIsEnabled, ENABLED, DISABLED]
            Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"conversational-execution-recovery"}}'
        ExecutionHealthPulse:
          Type: Schedule
          Properties:
            Description: Emit the idle-safe conversational execution worker health pulse.
            Schedule: rate(2 minutes)
            State: !If [ConversationalExecutionIsEnabled, ENABLED, DISABLED]
            Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"conversational-execution-health-pulse"}}'

  SponsorCommunicationFailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: SanitizedSponsorCommunicationFailure }

  SponsorCommunicationPrivateArchiveKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  SponsorCommunicationPrivateArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn }
            BucketKeyEnabled: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: RetainPrivateSponsorCommunicationArchives
            Status: Enabled
            Prefix: !Sub ${SponsorCommunicationPrivateArchivePrefix}/
            NoncurrentVersionExpirationInDays: 365
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateSponsorCommunicationArchive }

  SponsorSesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref SponsorSesConfigurationSetName
      SendingOptions:
        SendingEnabled: !If [SponsorCommunicationSendingEnabled, true, false]

  SponsorSesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SponsorSesConfigurationSet
      EventDestination:
        Enabled: true
        MatchingEventTypes: [SEND, DELIVERY, DELIVERY_DELAY, REJECT, RENDERING_FAILURE, BOUNCE, COMPLAINT]
        EventBridgeDestination:
          EventBusArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  SponsorSendWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/sponsor-send-worker-handler.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DATAOPS_SPONSOR_CRM_TABLE: !Ref DataOpsSponsorCrmTable
          DATAOPS_USERS_TABLE: !Ref DataOpsUsersTable
          SPONSOR_COMMUNICATION_SEND_ENABLED: !Ref SponsorCommunicationSendEnabled
          SPONSOR_COMMUNICATION_HMAC_SECRET_ARN: !Ref SponsorCommunicationHmacSecretArn
          SPONSOR_SEND_TIMEOUT_MS: "8000"
      Policies:
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
            Resource:
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-Communication
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendDue
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendLookup
        - Statement:
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt DataOpsUsersTable.Arn
        - !If
          - HasSponsorHmacSecret
          - Statement:
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SponsorCommunicationHmacSecretArn
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: ses:SendEmail
            Resource: !Ref SponsorSesIdentityArn
            Condition:
              StringEquals:
                ses:FromAddress: !Ref SponsorSesFromAddress
                ses:ConfigurationSet: !Ref SponsorSesConfigurationSet
        - Statement:
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt SponsorCommunicationFailureQueue.Arn
      Events:
        QueuedSponsorSend:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt DataOpsSponsorCrmTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt SponsorCommunicationFailureQueue.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"recordType":{"S":["sponsor-send-attempt"]},"status":{"S":["queued"]},"recoveryBlocked":{"BOOL":[false]}}}}'
        SponsorSendRecovery:
          Type: Schedule
          Properties:
            Description: Recover only indexed pre-dispatch sponsor send work.
            Schedule: rate(2 minutes)
            Enabled: true
            Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"sponsor-send-recovery"}}'

  SponsorSesEventFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/sponsor-ses-event-handler.handler
      Timeout: 20
      MemorySize: 512
      Environment:
        Variables:
          DATAOPS_SPONSOR_CRM_TABLE: !Ref DataOpsSponsorCrmTable
          SPONSOR_COMMUNICATION_HMAC_SECRET_ARN: !Ref SponsorCommunicationHmacSecretArn
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt SponsorCommunicationFailureQueue.Arn
      Policies:
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
            Resource:
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendLookup
        - !If
          - HasSponsorHmacSecret
          - Statement:
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SponsorCommunicationHmacSecretArn
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt SponsorCommunicationFailureQueue.Arn

  SponsorSesEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Project only opaque SES facts before sponsor event Lambda invocation.
      EventPattern:
        source: [aws.ses]
        account: [!Ref AWS::AccountId]
        region: [!Ref AWS::Region]
        detail-type: [Email Sent, Email Delivered, Email Bounced, Email Complaint Received, Email Rejected, Email Delivery Delayed, Email Rendering Failed]
        detail:
          mail:
            tags:
              ses:configuration-set:
                - !Ref SponsorSesConfigurationSet
      State: ENABLED
      Targets:
        - Arn: !GetAtt SponsorSesEventFunction.Arn
          Id: SanitizedSponsorSesEvent
          RetryPolicy: { MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 2 }
          InputTransformer:
            InputPathsMap:
              eventId: "$.id"
              eventTime: "$.time"
              eventType: "$.detail.eventType"
              messageId: "$.detail.mail.messageId"
              awsAccount: "$.account"
              awsRegion: "$.region"
              configurationSet: "$.detail.mail.tags['ses:configuration-set'][0]"
              configurationSetGeneration: "$.detail.mail.tags['configuration-set-generation'][0]"
              attemptCorrelation: "$.detail.mail.tags.attempt[0]"
              communicationId: "$.detail.mail.tags.communication[0]"
              configGeneration: "$.detail.mail.tags['config-generation'][0]"
            InputTemplate: '{"schemaVersion":"1","eventId":<eventId>,"eventTime":<eventTime>,"eventType":<eventType>,"messageId":<messageId>,"awsAccount":<awsAccount>,"awsRegion":<awsRegion>,"configurationSet":<configurationSet>,"configurationSetGeneration":<configurationSetGeneration>,"attemptCorrelation":<attemptCorrelation>,"communicationId":<communicationId>,"configGeneration":<configGeneration>}'

  SponsorSesEventInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SponsorSesEventFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SponsorSesEventRule.Arn

  SponsorPrivateArchiveFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/sponsor-private-archive-handler.handler
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          DATAOPS_SPONSOR_CRM_TABLE: !Ref DataOpsSponsorCrmTable
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_BUCKET: !Ref SponsorCommunicationPrivateArchiveBucket
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_PREFIX: !Ref SponsorCommunicationPrivateArchivePrefix
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_KMS_KEY: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn
      Policies:
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Scan]
            Resource: !GetAtt DataOpsSponsorCrmTable.Arn
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
            Resource: !Sub ${SponsorCommunicationPrivateArchiveBucket.Arn}/${SponsorCommunicationPrivateArchivePrefix}/*
        - Statement:
            Effect: Allow
            Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
            Resource: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn

  ConversationalResultDispatcherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/result-notification-handler.handler
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ConversationalResultDispatcherLogGroup
      Environment:
        Variables:
          DATAOPS_ENV: !Ref DataOpsEnvironment
          DATAOPS_CONVERSATIONAL_STATE_TABLE: !Ref DataOpsConversationalStateTable
          TELEGRAM_INTEGRATION_SECRET_NAME: !Ref TelegramIntegrationSecretName
          CONVERSATIONAL_RESULT_DISPATCH_LIMIT: "50"
          CONVERSATIONAL_RESULT_DISPATCH_LEASE_SECONDS: "60"
          CONVERSATIONAL_TELEGRAM_INGRESS_ENABLED: !Ref ConversationalTelegramIngressEnabled
          CONVERSATIONAL_EXECUTION_ENABLED: !Ref ConversationalExecutionEnabled
          CONVERSATIONAL_ENABLED_PLUGINS: !Ref ConversationalEnabledPlugins
          CONVERSATIONAL_TYPEFULLY_EXTERNAL_EXECUTION_ENABLED: !Ref ConversationalTypefullyExternalExecutionEnabled
          CONVERSATIONAL_TELEGRAM_VOICE_ENABLED: !Ref ConversationalTelegramVoiceEnabled
          CONVERSATIONAL_TELEGRAM_PHOTO_ENABLED: !Ref ConversationalTelegramPhotoEnabled
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DataOpsConversationalStateTable.Arn
              - !Sub ${DataOpsConversationalStateTable.Arn}/index/GSI2
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource:
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TelegramIntegrationSecretName}-*
      Events:
        ResultDelivery:
          Type: Schedule
          Properties:
            Description: Deliver owner-bound conversational execution results through the shared Telegram channel.
            Schedule: rate(1 minute)
            State: !If [ConversationalIngressIsEnabled, ENABLED, DISABLED]

  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ..
      Runtime: nodejs24.x
      Handler: dist/handler.handler
      Timeout: 30
      MemorySize: 1024
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ConversationalBackendLogGroup
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DataOpsTasksTable.Arn
              - !Sub ${DataOpsTasksTable.Arn}/index/*
              - !GetAtt DataOpsBundlesTable.Arn
              - !GetAtt DataOpsTemplatesTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
              - !GetAtt DataOpsFilesTable.Arn
              - !Sub ${DataOpsFilesTable.Arn}/index/*
              - !GetAtt DataOpsArtifactsTable.Arn
              - !GetAtt DataOpsAssistantJobsTable.Arn
              - !GetAtt DataOpsAuditEventsTable.Arn
              - !GetAtt DataOpsIntakeTable.Arn
              - !Sub ${DataOpsIntakeTable.Arn}/index/*
              - !GetAtt DataOpsNotificationsTable.Arn
              - !GetAtt DataOpsSessionsTable.Arn
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-Communication
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendDue
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendLookup
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorBookingCommunication
              - !GetAtt DataOpsNewsletterSlotsTable.Arn
              - !Sub ${DataOpsNewsletterSlotsTable.Arn}/index/*
              - !GetAtt DataOpsCalendarTable.Arn
              - !Sub ${DataOpsCalendarTable.Arn}/index/*
              - !GetAtt DataOpsConversationalStateTable.Arn
              - !Sub ${DataOpsConversationalStateTable.Arn}/index/*
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactGetItems
            Resource:
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsSponsorCrmTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt DataOpsCalendarTable.Arn
              - !GetAtt DataOpsConversationalStateTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GitHubTokenSecretName}-*
              - !Ref WorkEnginePortalSecret
              - !Ref BookkeepingIngestionSecret
              - !Ref EmailDocumentIntakeSecretArn
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TelegramIntegrationSecretName}-*
              - !If
                - HasZaiConversationalSecret
                - !Ref ZaiConversationalApiKeySecretArn
                - !Ref AWS::NoValue
              - !If
                - HasGroqTranscriptionSecret
                - !Ref GroqTranscriptionApiKeySecretArn
                - !Ref AWS::NoValue
              - !If
                - HasZaiVisionSecret
                - !Ref ZaiVisionApiKeySecretArn
                - !Ref AWS::NoValue
              - !If
                - HasSponsorTemplateSecret
                - !Ref SponsorCommunicationTemplateSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasSponsorHmacSecret
                - !Ref SponsorCommunicationHmacSecretArn
                - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem]
            Resource: !Ref DapierCredentialsTableArn
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys: [mailchimp]
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource:
              - !Sub ${DataOpsExportArchiveBucket.Arn}/${ExportArchivePrefix}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion, s3:HeadObject]
            Resource: !Sub ${BookkeepingDocumentsBucket.Arn}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub ${MailingExportsBucket.Arn}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject]
            Resource:
              - !Sub ${EmailDocumentsBucket.Arn}/${EmailDocumentSourcePrefix}*
              - !If
                - HasEmailDocumentExternalSource
                - !Sub arn:${AWS::Partition}:s3:::${EmailDocumentExternalSourceBucketName}/${EmailDocumentExternalSourcePrefix}*
                - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub ${EmailDocumentsBucket.Arn}/${EmailDocumentDestinationPrefix}*
        - Statement:
            Effect: Allow
            Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
            Resource:
              - !GetAtt BookkeepingDocumentsKey.Arn
              - !GetAtt EmailDocumentsKey.Arn
        - !If
          - HasEmailDocumentExternalSourceKms
          - Statement:
              Effect: Allow
              Action: [kms:Decrypt]
              Resource: !Ref EmailDocumentExternalSourceKmsKeyArn
          - !Ref AWS::NoValue
      Environment:
        Variables:
          DATAOPS_ENV: !Ref DataOpsEnvironment
          DATAOPS_TASKS_TABLE: !Ref DataOpsTasksTable
          DATAOPS_BUNDLES_TABLE: !Ref DataOpsBundlesTable
          DATAOPS_TEMPLATES_TABLE: !Ref DataOpsTemplatesTable
          DATAOPS_USERS_TABLE: !Ref DataOpsUsersTable
          DATAOPS_FILES_TABLE: !Ref DataOpsFilesTable
          DATAOPS_ARTIFACTS_TABLE: !Ref DataOpsArtifactsTable
          DATAOPS_ASSISTANT_JOBS_TABLE: !Ref DataOpsAssistantJobsTable
          DATAOPS_AUDIT_EVENTS_TABLE: !Ref DataOpsAuditEventsTable
          DATAOPS_INTAKE_TABLE: !Ref DataOpsIntakeTable
          DATAOPS_NOTIFICATIONS_TABLE: !Ref DataOpsNotificationsTable
          DATAOPS_SESSIONS_TABLE: !Ref DataOpsSessionsTable
          DATAOPS_BOOKKEEPING_TABLE: !Ref DataOpsBookkeepingTable
          DATAOPS_SPONSOR_CRM_TABLE: !Ref DataOpsSponsorCrmTable
          SPONSOR_FINANCE_ENABLED: !Ref SponsorFinanceEnabled
          DATAOPS_NEWSLETTER_SLOTS_TABLE: !Ref DataOpsNewsletterSlotsTable
          DATAOPS_CALENDAR_TABLE: !Ref DataOpsCalendarTable
          DATAOPS_CONVERSATIONAL_STATE_TABLE: !Ref DataOpsConversationalStateTable
          NEWSLETTER_OPEN_ALERT_LEAD_DAYS: !Ref NewsletterOpenAlertLeadDays
          NEWSLETTER_WORKFLOW_ALERT_LEAD_DAYS: !Ref NewsletterWorkflowAlertLeadDays
          BOOKKEEPING_DOCUMENTS_BUCKET: !Ref BookkeepingDocumentsBucket
          BOOKKEEPING_DOCUMENTS_KMS_KEY: !GetAtt BookkeepingDocumentsKey.Arn
          BOOKKEEPING_INGESTION_SECRET_NAME: !Ref BookkeepingIngestionSecret
          DATAOPS_EXPORT_ARCHIVE_BUCKET: !Ref DataOpsExportArchiveBucket
          DATAOPS_EXPORT_ARCHIVE_PREFIX: !Ref ExportArchivePrefix
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
          GITHUB_BRANCH: !Ref GitHubBranch
          GITHUB_TOKEN_SECRET_NAME: !Ref GitHubTokenSecretName
          AUTH_BASE_URL: !Ref AuthBaseUrl
          AUTH_USER_POOL_ID: !Ref AuthUserPoolId
          AUTH_ISSUER: !Ref AuthIssuer
          AUTH_JWKS_URL: !Ref AuthJwksUrl
          AUTH_CLIENT_ID: !Ref AuthClientId
          AUTH_CALLBACK_URL: !Ref AuthCallbackUrl
          AUTH_LOGOUT_URL: !Ref AuthLogoutUrl
          AUTH_SESSION_LIFETIME_SECONDS: !Ref AuthSessionLifetimeSeconds
          DATAOPS_DOCS_DOMAIN: "1"
          WORK_ENGINE_AUTH_MODE: portal
          WORK_ENGINE_PORTAL_SECRET_NAME: !Ref WorkEnginePortalSecret
          EMAIL_DOCUMENT_INTAKE_SECRET_NAME: !Ref EmailDocumentIntakeSecretArn
          EMAIL_DOCUMENTS_BUCKET: !Ref EmailDocumentsBucket
          EMAIL_DOCUMENTS_KMS_KEY: !GetAtt EmailDocumentsKey.Arn
          EMAIL_DOCUMENT_SOURCE_PREFIX: !Ref EmailDocumentSourcePrefix
          EMAIL_DOCUMENT_EXTERNAL_SOURCE_BUCKET: !Ref EmailDocumentExternalSourceBucketName
          EMAIL_DOCUMENT_EXTERNAL_SOURCE_PREFIX: !Ref EmailDocumentExternalSourcePrefix
          EMAIL_DOCUMENT_DESTINATION_PREFIX: !Ref EmailDocumentDestinationPrefix
          EMAIL_DOCUMENT_RECIPIENT_ROUTES: !Ref EmailDocumentRecipientRoutes
          EMAIL_DOCUMENT_RATE_LIMIT: !Ref EmailDocumentRateLimit
          DATAOPS_MAILING_EXPORTS_CONFIG: !Ref MailingExportsConfig
          DATAOPS_MAILING_EXPORTS_BUCKET: !Ref MailingExportsBucket
          DATAOPS_DAPIER_CREDENTIALS_TABLE: !Ref DapierCredentialsTableName
          TELEGRAM_INTEGRATION_SECRET_NAME: !Ref TelegramIntegrationSecretName
          CONVERSATIONAL_TELEGRAM_INGRESS_ENABLED: !Ref ConversationalTelegramIngressEnabled
          CONVERSATIONAL_EXECUTION_ENABLED: !Ref ConversationalExecutionEnabled
          CONVERSATIONAL_ENABLED_PLUGINS: !Ref ConversationalEnabledPlugins
          CONVERSATIONAL_TYPEFULLY_EXTERNAL_EXECUTION_ENABLED: !Ref ConversationalTypefullyExternalExecutionEnabled
          CONVERSATIONAL_TYPEFULLY_ACCOUNT_CONFIG_DIGEST: !Ref ConversationalTypefullyAccountConfigDigest
          CONVERSATIONAL_TYPEFULLY_PROVIDER_CONFIGURED: !If [HasTypefullyExecutionConfiguration, "true", "false"]
          ZAI_CONVERSATIONAL_API_KEY_SECRET_ARN: !Ref ZaiConversationalApiKeySecretArn
          CONVERSATIONAL_TELEGRAM_VOICE_ENABLED: !Ref ConversationalTelegramVoiceEnabled
          CONVERSATIONAL_TELEGRAM_PHOTO_ENABLED: !Ref ConversationalTelegramPhotoEnabled
          GROQ_TRANSCRIPTION_API_KEY_SECRET_ARN: !Ref GroqTranscriptionApiKeySecretArn
          ZAI_VISION_API_KEY_SECRET_ARN: !Ref ZaiVisionApiKeySecretArn
          ZAI_VISION_MODEL: !Ref ZaiVisionModel
          ZAI_VISION_BASE_URL: !Ref ZaiVisionBaseUrl
          TELEGRAM_HANDLER_DEADLINE_MS: !Ref TelegramHandlerDeadlineMs
          TELEGRAM_API_TIMEOUT_MS: !Ref TelegramApiTimeoutMs
          TELEGRAM_API_MAX_RESPONSE_BYTES: !Ref TelegramApiMaxResponseBytes
          TELEGRAM_VOICE_MAX_BYTES: !Ref TelegramVoiceMaxBytes
          TELEGRAM_VOICE_MAX_SECONDS: !Ref TelegramVoiceMaxSeconds
          TELEGRAM_PHOTO_MAX_BYTES: !Ref TelegramPhotoMaxBytes
          TELEGRAM_PHOTO_MAX_PIXELS: !Ref TelegramPhotoMaxPixels
          TELEGRAM_MEDIA_DOWNLOAD_TIMEOUT_MS: !Ref TelegramMediaDownloadTimeoutMs
          TELEGRAM_MEDIA_PROVIDER_TIMEOUT_MS: !Ref TelegramMediaProviderTimeoutMs
          TELEGRAM_MEDIA_PROVIDER_MAX_RESPONSE_BYTES: !Ref TelegramMediaProviderMaxResponseBytes
          TELEGRAM_MEDIA_MAX_TEXT_BYTES: !Ref TelegramMediaMaxTextBytes
          CONVERSATIONAL_PRESENTATION_TTL_SECONDS: !Ref ConversationalPresentationTtlSeconds
          CONVERSATIONAL_FAKE_EXECUTOR_ENABLED: "false"
          DATAOPS_DEPLOYMENT_ID: !Ref DataOpsDeploymentId
          CONVERSATIONAL_FAILURE_QUEUE_CONFIGURED: "true"
          CONVERSATIONAL_ALARM_TOPIC_CONFIGURED: "true"
          CONVERSATIONAL_ALARMS_CONFIGURED: "true"
          CONVERSATIONAL_LOG_GROUPS_CONFIGURED: "true"
          CONVERSATIONAL_ALARM_SUBSCRIPTION_CONFIRMED: !Ref ConversationalAlarmSubscriptionConfirmed
          SPONSOR_COMMUNICATION_SEND_ENABLED: !Ref SponsorCommunicationSendEnabled
          SPONSOR_COMMUNICATION_TEMPLATE_SECRET_ARN: !Ref SponsorCommunicationTemplateSecretArn
          SPONSOR_COMMUNICATION_HMAC_SECRET_ARN: !Ref SponsorCommunicationHmacSecretArn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowCredentials: false
          AllowHeaders:
            - authorization
            - content-type
            - x-user-email
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
          AllowOrigins:
            - "*"
      Events:
        DailyBackendCron:
          Type: Schedule
          Properties:
            Description: Run DataOps recurring task and automatic template generation once per day.
            Schedule: cron(0 8 * * ? *)
            Enabled: true
        DailyBackendExport:
          Type: Schedule
          Properties:
            Description: Export DataOps execution data to the retained offsite archive bucket once per day.
            Schedule: cron(30 8 * * ? *)
            Enabled: true
            Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"export"}}'
        DailyMailingExport:
          Type: Schedule
          Properties:
            Description: Request or advance configured mailing-list exports once per day.
