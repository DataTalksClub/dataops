  DataOpsIntakeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-intake
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
        - AttributeName: sourceMessageKey
          AttributeType: S
        - AttributeName: ownerStatusKey
          AttributeType: S
        - AttributeName: assigneeStatusKey
          AttributeType: S
        - AttributeName: assistantStatusKey
          AttributeType: S
        - AttributeName: followUpAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI-Status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-SourceMessage
          KeySchema:
            - AttributeName: sourceMessageKey
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-OwnerStatus
          KeySchema:
            - AttributeName: ownerStatusKey
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-AssigneeStatus
          KeySchema:
            - AttributeName: assigneeStatusKey
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-AssistantStatus
          KeySchema:
            - AttributeName: assistantStatusKey
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-FollowUp
          KeySchema:
            - AttributeName: followUpAt
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionState

  DataOpsNotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-notifications
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionState

  DataOpsSecretsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-secrets
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: PrivateTeamSecrets

  SecretsStoreKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  DataOpsSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-sessions
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: SessionState

  DataOpsExportArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainPortableExecutionExports
            Status: Enabled
            Prefix: !Sub ${ExportArchivePrefix}/
            NoncurrentVersionExpirationInDays: !Ref ExportArchiveRetentionDays
          - Id: ExpireRawDynamoBackups
            Status: Enabled
            Prefix: !Sub ${DynamoBackupPrefix}/
            ExpirationInDays: !Ref DynamoBackupRetentionDays
            NoncurrentVersionExpirationInDays: !Ref DynamoBackupRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: ExecutionExportArchive
        - Key: BackupSelection
          Value: DataOpsV1ExecutionExports

  WorkEnginePortalSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AWS::StackName}/work-engine/portal-secret
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: DataOps
        - Key: App
          Value: DataOpsV1
        - Key: DataClass
          Value: PortalBrokerSecret

  SponsorCommunicationPrivateArchiveKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  SponsorCommunicationPrivateArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn }
            BucketKeyEnabled: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: RetainPrivateSponsorCommunicationArchives
            Status: Enabled
            Prefix: !Sub ${SponsorCommunicationPrivateArchivePrefix}/
            NoncurrentVersionExpirationInDays: 365
      Tags:
        - { Key: Project, Value: DataOps }
        - { Key: App, Value: DataOpsV1 }
        - { Key: DataClass, Value: PrivateSponsorCommunicationArchive }

  SponsorPrivateArchiveFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      CodeUri: sam-build
      Runtime: nodejs24.x
      Handler: dist/sponsor-private-archive-handler.handler
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          DATAOPS_SPONSOR_CRM_TABLE: !Ref DataOpsSponsorCrmTable
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_BUCKET: !Ref SponsorCommunicationPrivateArchiveBucket
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_PREFIX: !Ref SponsorCommunicationPrivateArchivePrefix
          SPONSOR_COMMUNICATION_PRIVATE_ARCHIVE_KMS_KEY: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn
      Policies:
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Scan]
            Resource: !GetAtt DataOpsSponsorCrmTable.Arn
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
            Resource: !Sub ${SponsorCommunicationPrivateArchiveBucket.Arn}/${SponsorCommunicationPrivateArchivePrefix}/*
        - Statement:
            Effect: Allow
            Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
            Resource: !GetAtt SponsorCommunicationPrivateArchiveKey.Arn

  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: sam-build
      Runtime: nodejs24.x
      Handler: dist/handler.handler
      Timeout: 120
      MemorySize: 1024
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ConversationalBackendLogGroup
      Policies:
        - Statement:
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}
        - Statement:
            Effect: Allow
            Action: [s3:GetObject]
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/*
        - Statement:
            Effect: Allow
            Action: [s3:PutObject]
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/objects/*
              - !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/publications/*
              - !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/active.json
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:ConditionCheckItem
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DataOpsTasksTable.Arn
              - !Sub ${DataOpsTasksTable.Arn}/index/*
              - !GetAtt DataOpsCardsTable.Arn
              - !GetAtt DataOpsTemplatesTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
              - !GetAtt DataOpsFilesTable.Arn
              - !Sub ${DataOpsFilesTable.Arn}/index/*
              - !GetAtt DataOpsArtifactsTable.Arn
              - !GetAtt DataOpsAuditEventsTable.Arn
              - !GetAtt DataOpsSecretsTable.Arn
              - !GetAtt DataOpsIntakeTable.Arn
              - !Sub ${DataOpsIntakeTable.Arn}/index/*
              - !GetAtt DataOpsNotificationsTable.Arn
              - !GetAtt DataOpsSessionsTable.Arn
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-Communication
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorSendDue
              - !Sub ${DataOpsSponsorCrmTable.Arn}/index/GSI-SponsorBookingCommunication
              - !GetAtt DataOpsNewsletterSlotsTable.Arn
              - !Sub ${DataOpsNewsletterSlotsTable.Arn}/index/*
              - !GetAtt DataOpsCalendarTable.Arn
              - !Sub ${DataOpsCalendarTable.Arn}/index/*
              - !GetAtt DataOpsPodcastEpisodesTable.Arn
              - !Sub ${DataOpsPodcastEpisodesTable.Arn}/index/*
              - !GetAtt DataOpsPeopleTable.Arn
              - !GetAtt DataOpsBooksTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DescribeContinuousBackups
            Resource:
              - !GetAtt DataOpsTasksTable.Arn
              - !GetAtt DataOpsCardsTable.Arn
              - !GetAtt DataOpsTemplatesTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
              - !GetAtt DataOpsFilesTable.Arn
              - !GetAtt DataOpsArtifactsTable.Arn
              - !GetAtt DataOpsAuditEventsTable.Arn
              - !GetAtt DataOpsSecretsTable.Arn
              - !GetAtt DataOpsIntakeTable.Arn
              - !GetAtt DataOpsNotificationsTable.Arn
              - !GetAtt DataOpsSessionsTable.Arn
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !GetAtt DataOpsNewsletterSlotsTable.Arn
              - !GetAtt DataOpsCalendarTable.Arn
              - !GetAtt DataOpsPodcastEpisodesTable.Arn
              - !GetAtt DataOpsPeopleTable.Arn
              - !GetAtt DataOpsBooksTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: DataOps/DynamoBackup
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactGetItems
            Resource:
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsSponsorCrmTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:BatchGetItem
            Resource:
              - !GetAtt DataOpsBookkeepingTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt DataOpsSponsorCrmTable.Arn
              - !GetAtt DataOpsBookkeepingTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt DataOpsCalendarTable.Arn
              - !GetAtt DataOpsUsersTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref WorkEnginePortalSecret
              - !Ref EmailDocumentIntakeSecretArn
              - !If [HasInvoicePublicationConfig, !Ref InvoicePublicationSecret, !Ref AWS::NoValue]
              - !If
                - HasSponsorTemplateSecret
                - !Ref SponsorCommunicationTemplateSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasSponsorHmacSecret
                - !Ref SponsorCommunicationHmacSecretArn
                - !Ref AWS::NoValue
        # Alexey's calendar overlay reads the personal-scheduler Dapier token.
        # The secret lives outside this stack and uses the AWS-managed
        # aws/secretsmanager key, so no kms:Decrypt grant is needed.
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:personal-scheduler/dapier-api-token-??????
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource:
              - !Sub ${DataOpsExportArchiveBucket.Arn}/${ExportArchivePrefix}/*
              - !Sub ${DataOpsExportArchiveBucket.Arn}/${DynamoBackupPrefix}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion, s3:HeadObject]
            Resource: !Sub ${BookkeepingDocumentsBucket.Arn}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub ${TaskFilesBucket.Arn}/tasks/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject]
            Resource:
              - !Sub ${EmailDocumentsBucket.Arn}/${EmailDocumentSourcePrefix}*
              - !If
                - HasEmailDocumentExternalSource
                - !Sub arn:${AWS::Partition}:s3:::${EmailDocumentExternalSourceBucketName}/${EmailDocumentExternalSourcePrefix}*
                - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub ${EmailDocumentsBucket.Arn}/${EmailDocumentDestinationPrefix}*
        - Statement:
            Effect: Allow
            Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
            Resource:
              - !GetAtt BookkeepingDocumentsKey.Arn
              - !GetAtt EmailDocumentsKey.Arn
              - !GetAtt SecretsStoreKey.Arn
        - !If
          - HasEmailDocumentExternalSourceKms
          - Statement:
              Effect: Allow
              Action: [kms:Decrypt]
              Resource: !Ref EmailDocumentExternalSourceKmsKeyArn
          - !Ref AWS::NoValue
      Environment:
        Variables:
          DATAOPS_ENV: !Ref DataOpsEnvironment
          DATAOPS_TABLE_PREFIX: !Ref AWS::StackName
          DATAOPS_PODCAST_EPISODES_TABLE: !Ref DataOpsPodcastEpisodesTable
          DATAOPS_SECRETS_TABLE: !Ref DataOpsSecretsTable
          DATAOPS_SECRETS_KMS_KEY: !Ref SecretsStoreKey
          DATAOPS_PEOPLE_TABLE: !Ref DataOpsPeopleTable
          DATAOPS_BOOKS_TABLE: !Ref DataOpsBooksTable
          SPONSOR_FINANCE_ENABLED: !Ref SponsorFinanceEnabled
          NEWSLETTER_OPEN_ALERT_LEAD_DAYS: !Ref NewsletterOpenAlertLeadDays
          NEWSLETTER_WORKFLOW_ALERT_LEAD_DAYS: !Ref NewsletterWorkflowAlertLeadDays
          BOOKKEEPING_DOCUMENTS_BUCKET: !Ref BookkeepingDocumentsBucket
          TASK_FILES_BUCKET: !Ref TaskFilesBucket
          DATAOPS_FILE_STORAGE_PROVIDER: s3
          BOOKKEEPING_DOCUMENTS_KMS_KEY: !Ref BookkeepingDocumentsKey
          DATAOPS_EXPORT_ARCHIVE_BUCKET: !Ref DataOpsExportArchiveBucket
          DATAOPS_EXPORT_ARCHIVE_PREFIX: !Ref ExportArchivePrefix
          DATAOPS_DYNAMO_BACKUP_PREFIX: !Ref DynamoBackupPrefix
          KNOWLEDGE_BUCKET: !Ref KnowledgeBucketName
          AUTH_BASE_URL: !Ref AuthBaseUrl
          AUTH_ISSUER: !Ref AuthIssuer
          AUTH_JWKS_URL: !Ref AuthJwksUrl
          AUTH_CLIENT_ID: !Ref AuthClientId
          AUTH_CALLBACK_URL: !Ref AuthCallbackUrl
          AUTH_LOGOUT_URL: !Ref AuthLogoutUrl
          AUTH_SESSION_LIFETIME_SECONDS: !Ref AuthSessionLifetimeSeconds
          DATAOPS_DOCS_DOMAIN: "1"
          WORK_ENGINE_AUTH_MODE: portal
          WORK_ENGINE_PORTAL_SECRET_NAME: !Sub ${AWS::StackName}/work-engine/portal-secret
          INVOICE_PUBLICATION_SECRET_NAME: !If [HasInvoicePublicationConfig, !Ref InvoicePublicationSecret, ""]
          INVOICE_READER_TOKEN_SHA256: !Ref InvoiceReaderTokenSha256
          KNOWLEDGE_PUBLISHER_REPOSITORY: !Sub ${GitHubOwner}/${GitHubRepo}
          KNOWLEDGE_PUBLISHER_BRANCH: !Ref GitHubBranch
          EMAIL_DOCUMENT_INTAKE_SECRET_NAME: !Ref EmailDocumentIntakeSecretArn
          EMAIL_DOCUMENTS_BUCKET: !Ref EmailDocumentsBucket
          EMAIL_DOCUMENTS_KMS_KEY: !Ref EmailDocumentsKey
          EMAIL_DOCUMENT_SOURCE_PREFIX: !Ref EmailDocumentSourcePrefix
          EMAIL_DOCUMENT_EXTERNAL_SOURCE_BUCKET: !Ref EmailDocumentExternalSourceBucketName
          EMAIL_DOCUMENT_EXTERNAL_SOURCE_PREFIX: !Ref EmailDocumentExternalSourcePrefix
          EMAIL_DOCUMENT_DESTINATION_PREFIX: !Ref EmailDocumentDestinationPrefix
          EMAIL_DOCUMENT_RECIPIENT_ROUTES: !Ref EmailDocumentRecipientRoutes
          EMAIL_DOCUMENT_RATE_LIMIT: !Ref EmailDocumentRateLimit
          SPONSOR_COMMUNICATION_SEND_ENABLED: !Ref SponsorCommunicationSendEnabled
          SPONSOR_COMMUNICATION_TEMPLATE_SECRET_ARN: !Ref SponsorCommunicationTemplateSecretArn
          SPONSOR_COMMUNICATION_HMAC_SECRET_ARN: !Ref SponsorCommunicationHmacSecretArn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowCredentials: false
          AllowHeaders:
            - authorization
            - content-type
            - x-user-email
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
          AllowOrigins:
            - "*"

  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../mcp
      Handler: src/lambda.handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          DATAOPS_URL: !GetAtt BackendFunctionUrl.FunctionUrl
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowCredentials: false
          AllowHeaders: [authorization, content-type, accept, mcp-protocol-version, mcp-session-id]
          AllowMethods: [GET, POST]
          AllowOrigins: ["*"]

  McpFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${McpFunction}
      RetentionInDays: 30

  BackendFunctionDailyBackendCron:
    Type: AWS::Events::Rule
    Properties:
      Description: Run DataOps recurring task and automatic template generation once per day at 06:00 UTC (08:00 Europe/Berlin CEST).
      ScheduleExpression: cron(0 6 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BackendTargetFunctionName}
          Id: BackendFunctionDailyBackendCronLambdaTarget

  BackendFunctionDailyBackendCronPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendTargetFunctionName
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BackendFunctionDailyBackendCron.Arn

  BackendFunctionDailyBackendExport:
    Type: AWS::Events::Rule
    Properties:
      Description: Export DataOps execution data to the retained offsite archive bucket once per day.
      ScheduleExpression: cron(30 8 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BackendTargetFunctionName}
          Id: BackendFunctionDailyBackendExportLambdaTarget
          Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"export"}}'

  BackendFunctionDailyBackendExportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendTargetFunctionName
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BackendFunctionDailyBackendExport.Arn

  BackendFunctionDailyDynamoBackup:
    Type: AWS::Events::Rule
    Properties:
      Description: Dump every DataOps DynamoDB table to the retained archive bucket once per day.
      ScheduleExpression: cron(0 9 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BackendTargetFunctionName}
          Id: BackendFunctionDailyDynamoBackupLambdaTarget
          Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"dynamo-backup"}}'

  BackendFunctionDailyDynamoBackupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendTargetFunctionName
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BackendFunctionDailyDynamoBackup.Arn

  BackendFunctionDailyDynamoPitrCheck:
    Type: AWS::Events::Rule
    Properties:
      Description: Verify every DataOps DynamoDB table still has point-in-time recovery on, once per day.
      ScheduleExpression: cron(0 7 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BackendTargetFunctionName}
          Id: BackendFunctionDailyDynamoPitrCheckLambdaTarget
          Input: '{"source":"aws.events","detail-type":"Scheduled Event","detail":{"dataopsAction":"dynamo-pitr-check"}}'

  BackendFunctionDailyDynamoPitrCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendTargetFunctionName
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BackendFunctionDailyDynamoPitrCheck.Arn

  KnowledgeWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: sam-build
      Runtime: nodejs24.x
      Handler: dist/knowledge-worker-handler.handler
      Timeout: 900
      MemorySize: 1024
      EphemeralStorage: {Size: 1024}
      Environment:
        Variables:
          KNOWLEDGE_BUCKET: !Ref KnowledgeBucketName
          KNOWLEDGE_BACKUP_BUCKET: !Ref KnowledgeBackupBucketName
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
          GITHUB_BRANCH: !Ref GitHubBranch
          GITHUB_TOKEN_SECRET_NAME: !Ref GitHubTokenSecretName
      Policies:
        - Statement:
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}
        - Statement:
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBackupBucketName}
        - Statement:
            Effect: Allow
            Action: [s3:GetObject]
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/*
        - Statement:
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBackupBucketName}/*
        - Statement:
            Effect: Allow
            Action: [s3:PutObject]
            Resource: !Sub arn:${AWS::Partition}:s3:::${KnowledgeBucketName}/jobs/*
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GitHubTokenSecretName}-*
      Events:
        DailyKnowledgeBackup:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *)
            Enabled: true
            Input: '{"detail":{"dataopsAction":"knowledge-backup"}}'
        DailyKnowledgeMirror:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 * * ? *)
            Enabled: true
            Input: '{"detail":{"dataopsAction":"knowledge-mirror"}}'
  KnowledgeWorkerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-knowledge-worker-failure
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref KnowledgeWorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]
  KnowledgeBackupStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-knowledge-backup-stale
      Namespace: DataOps/Knowledge
      MetricName: Success
      Dimensions: [{Name: Job, Value: knowledge-backup}]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]
  KnowledgeMirrorStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-knowledge-mirror-stale
      Namespace: DataOps/Knowledge
      MetricName: Success
      Dimensions: [{Name: Job, Value: knowledge-mirror}]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]

  RecurringCronErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-recurring-cron-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref BackendFunction}]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]

  RecurringCronPassMissedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-recurring-cron-pass-missed
      Namespace: DataOps/Recurring
      MetricName: CronPass
      Dimensions: [{ Name: Component, Value: recurring-generation }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]

  RecurringCronFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-recurring-cron-failure
      Namespace: DataOps/Recurring
      MetricName: CronFailure
      Dimensions: [{ Name: Component, Value: recurring-generation }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ConversationalRolloutAlarmTopic]

  DynamoPitrDisabledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dynamo-pitr-disabled
      Namespace: DataOps/DynamoBackup
      MetricName: PitrDisabledTables
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref DynamoPitrAlarmTopic]

Outputs:
  ConversationalRolloutAlarmTopicArn:
    Value: !Ref ConversationalRolloutAlarmTopic
  DynamoPitrAlarmTopicArn:
    Value: !Ref DynamoPitrAlarmTopic
  SponsorCommunicationPrivateArchiveBucketName:
    Value: !Ref SponsorCommunicationPrivateArchiveBucket
  DataOpsBookkeepingTableName:
    Value: !Ref DataOpsBookkeepingTable
  BookkeepingDocumentsBucketName:
    Value: !Ref BookkeepingDocumentsBucket
  EmailDocumentsBucketName:
    Description: Retained private transfer and managed email-document artifact bucket
    Value: !Ref EmailDocumentsBucket
  BackendUrl:
    Description: Protected DataOps v1 Lambda Function URL
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  McpUrl:
    Description: Dedicated DataOps MCP endpoint; accepts the caller's DataOps bearer credential
    Value: !Sub ${McpFunctionUrl.FunctionUrl}mcp
  DataOpsTasksTableName:
    Description: DynamoDB table for task and recurring execution state
    Value: !Ref DataOpsTasksTable
  DataOpsCardsTableName:
    Description: DynamoDB table for workflow cards
    Value: !Ref DataOpsCardsTable
  DataOpsTemplatesTableName:
    Description: DynamoDB table for runtime template projections
    Value: !Ref DataOpsTemplatesTable
  DataOpsUsersTableName:
    Description: DynamoDB table for operator identities
    Value: !Ref DataOpsUsersTable
  DataOpsFilesTableName:
    Description: DynamoDB table for file metadata
    Value: !Ref DataOpsFilesTable
  DataOpsArtifactsTableName:
    Description: DynamoDB table for artifact metadata
    Value: !Ref DataOpsArtifactsTable
  DataOpsSecretsTableName:
    Description: DynamoDB table for the encrypted team secrets store
