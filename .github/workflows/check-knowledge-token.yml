name: Check Knowledge Token Expiry

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expiry:
    name: Warn before the knowledge repository token expires
    runs-on: ubuntu-latest

    steps:
      - name: Compare today against the recorded expiry
        env:
          EXPIRES_AT: ${{ vars.DATAOPS_KNOWLEDGE_TOKEN_EXPIRES_AT }}
        run: |
          set -euo pipefail

          if [ -z "${EXPIRES_AT}" ]; then
            echo "::error::DATAOPS_KNOWLEDGE_TOKEN_EXPIRES_AT is not set. See docs/knowledge-repo-access.md."
            exit 1
          fi

          expires_epoch="$(date -u -d "${EXPIRES_AT}" +%s)"
          today_epoch="$(date -u +%s)"
          days_left=$(( (expires_epoch - today_epoch) / 86400 ))

          echo "Knowledge repository token expires on ${EXPIRES_AT} (${days_left} days left)."

          if [ "${days_left}" -lt 0 ]; then
            echo "::error::The token expired on ${EXPIRES_AT}. The portal cannot read or edit process documents until it is rotated. See docs/knowledge-repo-access.md."
            exit 1
          fi

          if [ "${days_left}" -le 14 ]; then
            echo "::error::The token expires in ${days_left} days. Rotate it now: docs/knowledge-repo-access.md"
            exit 1
          fi

          if [ "${days_left}" -le 60 ]; then
            echo "::warning::The token expires in ${days_left} days. Plan the rotation: docs/knowledge-repo-access.md"
          fi
