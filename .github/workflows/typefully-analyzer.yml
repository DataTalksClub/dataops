name: Typefully Analyzer CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/typefully-analyzer.yml"
      - "scripts/typefully/**"
  pull_request:
    paths:
      - ".github/workflows/typefully-analyzer.yml"
      - "scripts/typefully/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typefully-analyzer:
    name: Test offline Typefully analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run offline Typefully analyzer tests
        run: node --test scripts/typefully/analyze-posts.test.mjs
