name: Reset disposable sandbox Sponsor CRM table

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run exactly one reviewed reset phase; #149 and all HUMAN gates must already be complete
        required: true
        type: choice
        options:
          - preflight
          - disable-protection
          - delete
          - create
          - execute
          - verify
          - cleanup-candidate
          - restore-protection
          - abandon
      approval:
        description: Exact digest-bound phase approval after private review
        required: true
        type: string
      stack_id_digest:
        description: Privately reviewed SHA-256 anchor, formatted sha256 followed by colon and 64 lowercase hex characters
        required: true
        type: string
      receipt_id:
        description: Opaque prior receipt ID, or none for preflight
        required: true
        type: string
        default: none
      receipt_digest:
        description: Prior receipt digest, or sha256 colon none for preflight
        required: true
        type: string
        default: sha256:none

permissions:
  contents: read

concurrency:
  group: dataops-v1-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::817685572750:role/dataops-github-actions-deploy

jobs:
  reset:
    name: Run one Sponsor reset phase
    runs-on: ubuntu-latest
    if: github.actor == 'alexeygrigorev'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out exact dispatched revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install reset runtime dependencies
        run: npm ci

      - name: Reject invalid public dispatch inputs before AWS
        env:
          SPONSOR_RESET_PHASE: ${{ inputs.phase }}
          SPONSOR_RESET_APPROVAL: ${{ inputs.approval }}
          SPONSOR_RESET_STACK_ID_DIGEST: ${{ inputs.stack_id_digest }}
          SPONSOR_RESET_RECEIPT_ID: ${{ inputs.receipt_id }}
          SPONSOR_RESET_RECEIPT_DIGEST: ${{ inputs.receipt_digest }}
        run: node scripts/deploy/sponsor-crm-reset.mjs validate-runtime

      - name: Verify reset contracts without AWS
        run: npm run test:sponsor-reset

      - name: Configure exact sandbox deployment identity
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: dataops-v1-sponsor-reset
          aws-region: ${{ env.AWS_REGION }}

      - name: Run exactly one fail-closed phase
        env:
          SPONSOR_RESET_PHASE: ${{ inputs.phase }}
          SPONSOR_RESET_APPROVAL: ${{ inputs.approval }}
          SPONSOR_RESET_STACK_ID_DIGEST: ${{ inputs.stack_id_digest }}
          SPONSOR_RESET_RECEIPT_ID: ${{ inputs.receipt_id }}
          SPONSOR_RESET_RECEIPT_DIGEST: ${{ inputs.receipt_digest }}
        run: node scripts/deploy/sponsor-crm-reset.mjs
