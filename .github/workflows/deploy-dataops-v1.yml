      - name: Prove final steady state before seeds and read-only smoke
        run: |
          set -euo pipefail
          stack_json="$(aws cloudformation describe-stacks --stack-name dataops-v1 --output json)"
          if [ "$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")" != "UPDATE_COMPLETE" ]; then
            echo "Issue #166 Phase D stack update did not reach UPDATE_COMPLETE" >&2
            exit 1
          fi
          processed_template="$RUNNER_TEMP/dataops-issue-166-phase-d-result-template.json"
          aws cloudformation get-template --stack-name dataops-v1 --template-stage Processed \
            --query TemplateBody --output json > "$processed_template"
          node --input-type=module - "$processed_template" <<'JS'
          import { readFileSync } from 'node:fs';
          const encoded = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const template = typeof encoded === 'string' ? JSON.parse(encoded) : encoded;
          if (!template || typeof template !== 'object' || Array.isArray(template)) {
            throw new Error('Issue #166 Phase D processed final template must be a JSON object');
          }
          const resources = template?.Resources ?? {};
          const tasks = resources.DataOpsTasksTable;
          const attributes = (tasks?.Properties?.AttributeDefinitions ?? []).map(({ AttributeName }) => AttributeName).sort();
          const indexes = (tasks?.Properties?.GlobalSecondaryIndexes ?? []).map(({ IndexName }) => IndexName).sort();
          const exactEvents = [
            ['BackendFunctionDailyBackendCron', 'AWS::Events::Rule'],
            ['BackendFunctionDailyBackendExport', 'AWS::Events::Rule'],
            ['BackendFunctionDailyMailingExport', 'AWS::Events::Rule'],
            ['ConversationalExecutionWorkerFunctionQueuedAttemptStream', 'AWS::Lambda::EventSourceMapping'],
            ['ConversationalExecutionWorkerFunctionExecutionRecovery', 'AWS::Events::Rule'],
            ['ConversationalExecutionWorkerFunctionExecutionHealthPulse', 'AWS::Events::Rule'],
          ].every(([id, type]) => resources[id]?.Type === type);
          const exact = template?.Metadata?.DataOpsIssue166Cutover === undefined
            && tasks?.Type === 'AWS::DynamoDB::Table'
            && tasks?.DeletionPolicy === 'Retain' && tasks?.UpdateReplacePolicy === 'Retain'
            && JSON.stringify(tasks?.Properties?.TableName) === JSON.stringify({ 'Fn::Sub': '${AWS::StackName}-tasks' })
            && JSON.stringify(attributes) === JSON.stringify(['PK', 'SK', 'cardId', 'date', 'status'])
            && JSON.stringify(indexes) === JSON.stringify(['GSI-Card', 'GSI-Date', 'GSI-Status'])
            && resources.BackendFunction?.Properties?.ReservedConcurrentExecutions === undefined
            && resources.ConversationalExecutionWorkerFunction?.Properties?.ReservedConcurrentExecutions === undefined
            && JSON.stringify(resources.ConversationalExecutionWorkerFunction?.Properties?.Environment?.Variables?.DATAOPS_TASKS_TABLE)
              === JSON.stringify({ Ref: 'DataOpsTasksTable' })
            && JSON.stringify(template?.Outputs?.DataOpsTasksTableName?.Value)
              === JSON.stringify({ Ref: 'DataOpsTasksTable' })
            && JSON.stringify(resources.BackendFunctionRole?.Properties?.Policies).includes('DataOpsTasksTable')
            && JSON.stringify(resources.ConversationalExecutionWorkerFunctionRole?.Properties?.Policies).includes('DataOpsTasksTable')
            && exactEvents;
          if (!exact || JSON.stringify(template).includes('bundleId') || JSON.stringify(template).includes('GSI-Bundle')) {
            throw new Error('Issue #166 Phase D did not deploy the exact marker-free final table and writer dependencies');
          }
          JS

          table_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
            --logical-resource-id DataOpsTasksTable --query StackResourceDetail.PhysicalResourceId --output text)"
          table_json="$(aws dynamodb describe-table --table-name "$table_name" --output json)"
          output_table_name="$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey == "DataOpsTasksTableName") | .OutputValue' <<<"$stack_json")"
          if [ "$table_name" != "dataops-v1-tasks" ] || [ "$output_table_name" != "$table_name" ] \
            || ! jq -e --arg tableId "$ISSUE_166_PHASE_C_TABLE_ID" '
            .Table.TableStatus == "ACTIVE"
            and .Table.TableId == $tableId
            and .Table.TableId != "b4e83537-7cf6-41cb-a281-8a52f678b1a3"
            and .Table.BillingModeSummary.BillingMode == "PAY_PER_REQUEST"
            and .Table.SSEDescription.Status == "ENABLED"
            and ([.Table.AttributeDefinitions[].AttributeName] | sort == ["PK", "SK", "cardId", "date", "status"])
            and .Table.KeySchema == [{"AttributeName":"PK","KeyType":"HASH"},{"AttributeName":"SK","KeyType":"RANGE"}]
            and ([.Table.GlobalSecondaryIndexes[].IndexStatus] | all(. == "ACTIVE"))
            and ([.Table.GlobalSecondaryIndexes[].IndexName] | sort == ["GSI-Card", "GSI-Date", "GSI-Status"])
            and ([.Table.GlobalSecondaryIndexes[] | {IndexName,KeySchema,Projection}] | sort_by(.IndexName)) == ([
              {IndexName:"GSI-Card",KeySchema:[{AttributeName:"cardId",KeyType:"HASH"},{AttributeName:"date",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}},
              {IndexName:"GSI-Date",KeySchema:[{AttributeName:"date",KeyType:"HASH"},{AttributeName:"status",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}},
              {IndexName:"GSI-Status",KeySchema:[{AttributeName:"status",KeyType:"HASH"},{AttributeName:"date",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}}
            ] | sort_by(.IndexName))
          ' <<<"$table_json" >/dev/null; then
            echo "Issue #166 Phase D changed the reviewed table identity or final schema" >&2
            exit 1
          fi
          table_arn="$(jq -r '.Table.TableArn' <<<"$table_json")"
          if [ "$(aws dynamodb describe-continuous-backups --table-name "$table_name" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' --output text)" != "ENABLED" ]; then
            echo "Issue #166 Phase D did not retain PITR" >&2
            exit 1
          fi
          tags_json="$(aws dynamodb list-tags-of-resource --resource-arn "$table_arn" --output json)"
          if ! jq -e '([.Tags[] | select(.Key == "Project" and .Value == "DataOps")] | length) == 1
            and ([.Tags[] | select(.Key == "App" and .Value == "DataOpsV1")] | length) == 1
            and ([.Tags[] | select(.Key == "DataClass" and .Value == "ExecutionState")] | length) == 1' <<<"$tags_json" >/dev/null; then
            echo "Issue #166 Phase D did not retain exact Tasks-table ownership tags" >&2
            exit 1
          fi
          canonical_task_count=0
          last_evaluated_key=""
          while true; do
            scan_args=(
              dynamodb scan
              --table-name "$table_name"
              --consistent-read
              --no-paginate
              --limit 100
              --filter-expression 'begins_with(#pk, :taskPrefix)'
              --projection-expression '#pk,#sk,#version,#history,#card,#bundle'
              --expression-attribute-names '{"#pk":"PK","#sk":"SK","#version":"version","#history":"taskHistory","#card":"cardId","#bundle":"bundleId"}'
              --expression-attribute-values '{":taskPrefix":{"S":"TASK#"}}'
              --output json
            )
            if [ -n "$last_evaluated_key" ]; then
              scan_args+=(--exclusive-start-key "$last_evaluated_key")
            fi
            page_json="$(aws "${scan_args[@]}")"
            if ! jq -e '
              all(.Items[];
                (.PK.S | type == "string" and startswith("TASK#"))
                and (.SK.S == .PK.S)
                and ((.version | keys) == ["N"])
                and (.version.N | test("^[1-9][0-9]*$"))
                and ((.taskHistory | keys) == ["L"])
                and ((has("cardId") | not) or ((.cardId | keys) == ["S"] and (.cardId.S | length) > 0))
                and (has("bundleId") | not)
              )
            ' <<<"$page_json" >/dev/null; then
              echo "Issue #166 Phase D observed a noncanonical Task after writer reopen" >&2
              exit 1
            fi
            canonical_task_count=$((canonical_task_count + $(jq -r '.Count' <<<"$page_json")))
            last_evaluated_key="$(jq -c '.LastEvaluatedKey // empty' <<<"$page_json")"
            if [ -z "$last_evaluated_key" ]; then
              break
            fi
          done
          for logical_id in BackendFunction ConversationalExecutionWorkerFunction; do
            function_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
              --logical-resource-id "$logical_id" --query StackResourceDetail.PhysicalResourceId --output text)"
            concurrency_json="$(aws lambda get-function-concurrency --function-name "$function_name" --output json)"
            if ! jq -e 'has("ReservedConcurrentExecutions") | not' <<<"$concurrency_json" >/dev/null; then
              echo "Issue #166 Phase D did not remove reserved concurrency for $logical_id" >&2
              exit 1
            fi
          done
          backend_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
            --logical-resource-id BackendFunction --query StackResourceDetail.PhysicalResourceId --output text)"
          worker_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
            --logical-resource-id ConversationalExecutionWorkerFunction --query StackResourceDetail.PhysicalResourceId --output text)"
          if [ "$(aws lambda get-function-configuration --function-name "$backend_name" \
            --query Environment.Variables.DATAOPS_DEPLOYMENT_ID --output text)" != "$GITHUB_SHA" ] \
            || [ "$(aws lambda get-function-configuration --function-name "$worker_name" \
            --query Environment.Variables.DATAOPS_TASKS_TABLE --output text)" != "$table_name" ]; then
            echo "Issue #166 Phase D deployed function configuration does not resolve the reviewed artifact/table" >&2
            exit 1
          fi
          backend_arn="$(aws lambda get-function --function-name "$backend_name" --query Configuration.FunctionArn --output text)"
          worker_arn="$(aws lambda get-function --function-name "$worker_name" --query Configuration.FunctionArn --output text)"
          if [ "$(aws events list-rule-names-by-target --target-arn "$backend_arn" --query 'RuleNames | length(@)' --output text)" != "3" ] \
            || [ "$(aws events list-rule-names-by-target --target-arn "$worker_arn" --query 'RuleNames | length(@)' --output text)" != "2" ] \
            || [ "$(aws lambda list-event-source-mappings --function-name "$worker_name" \
            --query 'EventSourceMappings[?State==`Enabled` || State==`Enabling` || State==`Creating`] | length(@)' --output text)" != "1" ]; then
            echo "Issue #166 Phase D did not restore the exact writer trigger set" >&2
            exit 1
          fi
          echo "Issue #166 Phase D deployed canonical writers; canonical Task count after reopen: $canonical_task_count."

      - name: Seed runtime users, workflow templates, and recurring configs
        run: |
          set -euo pipefail
          backend_function="$(aws cloudformation describe-stack-resource \
            --stack-name dataops-v1 \
            --logical-resource-id BackendFunction \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text)"
          seed_response="$RUNNER_TEMP/issue-166-phase-d-runtime-seeds.json"
          seed_error="$(aws lambda invoke \
            --function-name "$backend_function" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"source":"dataops.deploy","detail-type":"Runtime Seed","detail":{"dataopsAction":"sync-runtime-seeds"}}' \
            --query FunctionError \
            --output text \
            "$seed_response")"
          if [ "$seed_error" != "None" ]; then
            echo "Runtime seed failed inside the deployed Lambda" >&2
            exit 1
          fi
          if ! jq -e '
            def nonnegative_integer: type == "number" and floor == . and . >= 0;
            .statusCode == 200
            and ((.body | fromjson) as $body
              | ($body | keys == ["recurring", "templates", "users"])
              and ($body.users | keys == ["created", "processed", "unchanged", "updated"])
              and ($body.users.processed == 3)
              and ([$body.users.created, $body.users.updated, $body.users.unchanged] | all(.[]; nonnegative_integer))
              and ($body.users.created + $body.users.updated + $body.users.unchanged == 3)
              and ($body.templates | keys == ["created", "total", "unchanged", "updated"])
              and ($body.templates.total == 11)
              and ([$body.templates.created, $body.templates.updated, $body.templates.unchanged] | all(.[]; nonnegative_integer))
              and ($body.templates.created + $body.templates.updated + $body.templates.unchanged == 11)
              and ($body.recurring | keys == ["created", "repairedTasks", "skipped", "total", "updated"])
              and ($body.recurring.total == 7)
              and ([$body.recurring.created, $body.recurring.updated, $body.recurring.skipped, $body.recurring.repairedTasks] | all(.[]; nonnegative_integer))
              and ($body.recurring.created + $body.recurring.updated + $body.recurring.skipped == 7)
            )
          ' "$seed_response" >/dev/null; then
            echo "Runtime seed did not confirm the exact users, Templates, and recurring-config contract" >&2
            exit 1
          fi
          echo "Runtime users, workflow templates, and recurring configs synchronized."

      - name: Smoke test deployed single-origin backend
        run: |
          backend_url="$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" \
            --output text)"
          # The Function URL output ends with a trailing slash; strip it so we hit
          # "/" and "/login" instead of malformed double-slash paths ("//", "//login").
          backend_url="${backend_url%/}"
          # /login redirects to the shared Cognito authorize endpoint and root redirects locally.
          # The Function URL event normalization in handler.ts must work for this.
          # Retry a few times: immediately after a stack update the Function URL can
          # briefly return a cold-start/propagation blip before the new code settles.
          code=""
          login_code=""
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$backend_url/")
            login_code=$(curl -sS -o /dev/null -w "%{http_code}" "$backend_url/login")
            if [ "$code" = "302" ] && [ "$login_code" = "302" ]; then
              echo "Backend smoke OK on attempt $attempt: root=$code login=$login_code"
              exit 0
            fi
            echo "Smoke attempt $attempt: root=$code login=$login_code (retrying)"
            sleep 10
          done
          echo "Backend smoke test failed after retries: root expected 302 got $code; /login expected 302 got $login_code"
          exit 1

      - name: Authenticated read-only Task smoke after canonical seeds
        run: |
          set -euo pipefail
          backend_url="$(aws cloudformation describe-stacks --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" --output text)"
          backend_url="${backend_url%/}"
          portal_secret_name="$(aws cloudformation describe-stacks --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='WorkEnginePortalSecretName'].OutputValue" --output text)"
          portal_secret="$(aws secretsmanager get-secret-value --secret-id "$portal_secret_name" --query SecretString --output text)"
          list_body="$RUNNER_TEMP/issue-166-phase-d-task-list.json"
          get_body="$RUNNER_TEMP/issue-166-phase-d-task-get.json"
          list_code="$(curl -sS -o "$list_body" -w "%{http_code}" \
            -H "x-portal-auth: true" -H "x-portal-secret: $portal_secret" \
            -H "x-user-id: 00000000-0000-0000-0000-000000000001" \
            "$backend_url/api/tasks?status=todo")"
          get_code="$(curl -sS -o "$get_body" -w "%{http_code}" \
            -H "x-portal-auth: true" -H "x-portal-secret: $portal_secret" \
            -H "x-user-id: 00000000-0000-0000-0000-000000000001" \
            "$backend_url/api/tasks/issue-166-phase-d-empty-proof")"
          unset portal_secret
          if [ "$list_code" != "200" ] || ! jq -e '
            (.tasks | type == "array")
            and all(.tasks[];
              (.id | type == "string" and length > 0)
              and (.version | type == "number" and floor == . and . >= 1)
              and (.taskHistory | type == "array")
              and ((has("cardId") | not) or (.cardId | type == "string" and length > 0))
              and (has("bundleId") | not)
            )
          ' "$list_body" >/dev/null \
            || [ "$get_code" != "404" ] || ! jq -e '.error == "Task not found"' "$get_body" >/dev/null; then
            echo "Issue #166 Phase D authenticated read-only Task list/get smoke failed" >&2
            exit 1
          fi
          echo "Authenticated read-only Task list/get smoke proved the canonical Task surface."
