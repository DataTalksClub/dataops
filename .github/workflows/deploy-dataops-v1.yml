name: Deploy DataOps V1 Lambda

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-dataops-v1.yml"
      - "backend/**"
      - "content/**"
      - "frontend/**"
      - "infra/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "samconfig.toml"
      - "scripts/deploy/**"
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Normal deploy, or one reviewed issue #166 cutover phase."
        required: true
        type: choice
        default: normal
        options:
          - normal
          - issue-166-phase-a
          - issue-166-phase-b
          - issue-166-phase-c
      issue_166_commit:
        description: Exact 40-character commit SHA; required only for an issue-166 cutover phase.
        required: false
        type: string
      issue_166_backup_name:
        description: Exact AVAILABLE on-demand backup name; required only for an issue-166 cutover phase.
        required: false
        type: string
      issue_166_expected_ledger:
        description: Exact reconciled ledger; required only for an issue-166 cutover phase.
        required: false
        type: string
      issue_166_confirmation:
        description: Exact phase-specific operator confirmation; required only for an issue-166 cutover phase.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dataops-v1-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::817685572750:role/dataops-github-actions-deploy
  DOCS_GITHUB_OWNER: DataTalksClub
  DOCS_GITHUB_REPO: dataops-knowledge
  DOCS_GITHUB_TOKEN_SECRET: dataops-v1/knowledge/github-token
  DOCS_GITHUB_BRANCH: main

jobs:
  checks:
    name: Check DataOps v1 app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Run frontend unit coverage
        run: npm run test:frontend:coverage

      - name: Run backend tests
        run: npm --prefix backend test


      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Build backend
        run: npm --prefix backend run build

      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM template
        run: make sam-validate



  deploy:
    name: Deploy DataOps v1 app
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'normal' }}
      ISSUE_166_COMMIT: ${{ inputs.issue_166_commit || '' }}
      ISSUE_166_BACKUP_NAME: ${{ inputs.issue_166_backup_name || '' }}
      ISSUE_166_EXPECTED_LEDGER: ${{ inputs.issue_166_expected_ledger || '' }}
      ISSUE_166_CONFIRMATION: ${{ inputs.issue_166_confirmation || '' }}
      AUTH_BASE_URL: https://auth.dtcdev.click
      AUTH_USER_POOL_ID: us-east-1_H7nJu52Bs
      AUTH_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_H7nJu52Bs
      AUTH_JWKS_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_H7nJu52Bs/.well-known/jwks.json
      AUTH_CLIENT_ID: 1kjv61esdjs3003s8u42sgr3hf
      AUTH_CALLBACK_URL: https://ops.dtcdev.click/auth/callback
      AUTH_LOGOUT_URL: https://ops.dtcdev.click/
      AUTH_SESSION_LIFETIME_SECONDS: 28800
      EMAIL_DOCUMENT_INTAKE_SECRET_ARN: ${{ secrets.EMAIL_DOCUMENT_INTAKE_SECRET_ARN }}
      EMAIL_DOCUMENT_EXTERNAL_SOURCE_BUCKET: ${{ vars.EMAIL_DOCUMENT_EXTERNAL_SOURCE_BUCKET }}
      EMAIL_DOCUMENT_EXTERNAL_SOURCE_PREFIX: ${{ vars.EMAIL_DOCUMENT_EXTERNAL_SOURCE_PREFIX }}
      EMAIL_DOCUMENT_EXTERNAL_SOURCE_KMS_KEY_ARN: ${{ secrets.EMAIL_DOCUMENT_EXTERNAL_SOURCE_KMS_KEY_ARN }}
      DAPIER_CREDENTIALS_TABLE_NAME: ${{ vars.DAPIER_CREDENTIALS_TABLE_NAME }}
      DAPIER_CREDENTIALS_TABLE_ARN: ${{ vars.DAPIER_CREDENTIALS_TABLE_ARN }}
      MAILING_EXPORTS_CONFIG: ${{ vars.MAILING_EXPORTS_CONFIG }}
      CONVERSATIONAL_TELEGRAM_INGRESS_ENABLED: ${{ vars.CONVERSATIONAL_TELEGRAM_INGRESS_ENABLED }}
      SPONSOR_FINANCE_ENABLED: ${{ vars.SPONSOR_FINANCE_ENABLED }}
      CONVERSATIONAL_EXECUTION_ENABLED: ${{ vars.CONVERSATIONAL_EXECUTION_ENABLED }}
      CONVERSATIONAL_ENABLED_PLUGINS: ${{ vars.CONVERSATIONAL_ENABLED_PLUGINS }}
      CONVERSATIONAL_TYPEFULLY_EXTERNAL_EXECUTION_ENABLED: ${{ vars.CONVERSATIONAL_TYPEFULLY_EXTERNAL_EXECUTION_ENABLED }}
      CONVERSATIONAL_TYPEFULLY_ACCOUNT_CONFIG_DIGEST: ${{ vars.CONVERSATIONAL_TYPEFULLY_ACCOUNT_CONFIG_DIGEST }}
      TYPEFULLY_ACCOUNT_CONFIG_REVISION: ${{ vars.TYPEFULLY_ACCOUNT_CONFIG_REVISION }}
      TYPEFULLY_BASE_URL: ${{ vars.TYPEFULLY_BASE_URL }}
      WORK_ENGINE_TYPEFULLY_API_TOKEN_SECRET_ARN: ${{ vars.WORK_ENGINE_TYPEFULLY_API_TOKEN_SECRET_ARN }}
      TYPEFULLY_SOCIAL_SET_ALEXEY: ${{ vars.TYPEFULLY_SOCIAL_SET_ALEXEY }}
      TYPEFULLY_SOCIAL_SET_DATATALKSCLUB: ${{ vars.TYPEFULLY_SOCIAL_SET_DATATALKSCLUB }}
      ZAI_CONVERSATIONAL_API_KEY_SECRET_ARN: ${{ vars.ZAI_CONVERSATIONAL_API_KEY_SECRET_ARN }}
      CONVERSATIONAL_TELEGRAM_VOICE_ENABLED: ${{ vars.CONVERSATIONAL_TELEGRAM_VOICE_ENABLED }}
      CONVERSATIONAL_TELEGRAM_PHOTO_ENABLED: ${{ vars.CONVERSATIONAL_TELEGRAM_PHOTO_ENABLED }}
      CONVERSATIONAL_ALARM_SUBSCRIPTION_CONFIRMED: ${{ vars.CONVERSATIONAL_ALARM_SUBSCRIPTION_CONFIRMED }}
      GROQ_TRANSCRIPTION_API_KEY_SECRET_ARN: ${{ vars.GROQ_TRANSCRIPTION_API_KEY_SECRET_ARN }}
      ZAI_VISION_API_KEY_SECRET_ARN: ${{ vars.ZAI_VISION_API_KEY_SECRET_ARN }}
      ZAI_VISION_MODEL: ${{ vars.ZAI_VISION_MODEL }}
      ZAI_VISION_BASE_URL: ${{ vars.ZAI_VISION_BASE_URL }}
      TELEGRAM_HANDLER_DEADLINE_MS: ${{ vars.TELEGRAM_HANDLER_DEADLINE_MS }}
      TELEGRAM_API_TIMEOUT_MS: ${{ vars.TELEGRAM_API_TIMEOUT_MS }}
      TELEGRAM_API_MAX_RESPONSE_BYTES: ${{ vars.TELEGRAM_API_MAX_RESPONSE_BYTES }}
      TELEGRAM_VOICE_MAX_BYTES: ${{ vars.TELEGRAM_VOICE_MAX_BYTES }}
      TELEGRAM_VOICE_MAX_SECONDS: ${{ vars.TELEGRAM_VOICE_MAX_SECONDS }}
      TELEGRAM_PHOTO_MAX_BYTES: ${{ vars.TELEGRAM_PHOTO_MAX_BYTES }}
      TELEGRAM_PHOTO_MAX_PIXELS: ${{ vars.TELEGRAM_PHOTO_MAX_PIXELS }}
      TELEGRAM_MEDIA_DOWNLOAD_TIMEOUT_MS: ${{ vars.TELEGRAM_MEDIA_DOWNLOAD_TIMEOUT_MS }}
      TELEGRAM_MEDIA_PROVIDER_TIMEOUT_MS: ${{ vars.TELEGRAM_MEDIA_PROVIDER_TIMEOUT_MS }}
      TELEGRAM_MEDIA_PROVIDER_MAX_RESPONSE_BYTES: ${{ vars.TELEGRAM_MEDIA_PROVIDER_MAX_RESPONSE_BYTES }}
      TELEGRAM_MEDIA_MAX_TEXT_BYTES: ${{ vars.TELEGRAM_MEDIA_MAX_TEXT_BYTES }}
      SPONSOR_COMMUNICATION_SEND_ENABLED: ${{ vars.SPONSOR_COMMUNICATION_SEND_ENABLED }}
      SPONSOR_COMMUNICATION_TEMPLATE_SECRET_ARN: ${{ vars.SPONSOR_COMMUNICATION_TEMPLATE_SECRET_ARN }}
      SPONSOR_COMMUNICATION_HMAC_SECRET_ARN: ${{ vars.SPONSOR_COMMUNICATION_HMAC_SECRET_ARN }}
      SPONSOR_SES_IDENTITY_ARN: ${{ vars.SPONSOR_SES_IDENTITY_ARN }}
      SPONSOR_SES_FROM_ADDRESS: ${{ vars.SPONSOR_SES_FROM_ADDRESS }}
      SPONSOR_SES_CONFIGURATION_SET_NAME: ${{ vars.SPONSOR_SES_CONFIGURATION_SET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate bounded deployment mode
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            normal)
              if [ -n "$ISSUE_166_COMMIT$ISSUE_166_BACKUP_NAME$ISSUE_166_EXPECTED_LEDGER$ISSUE_166_CONFIRMATION" ]; then
                echo "Normal deploy refuses issue #166 cutover inputs" >&2
                exit 1
              fi
              ;;
            issue-166-phase-a)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Issue #166 Phase A requires an explicit manual dispatch of main" >&2
                exit 1
              fi
              if ! [[ "$ISSUE_166_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$ISSUE_166_COMMIT" != "$GITHUB_SHA" ]; then
                echo "Issue #166 Phase A commit must exactly match the dispatched commit" >&2
                exit 1
              fi
              if [ "$ISSUE_166_BACKUP_NAME" != "dataops-v1-tasks-pre-card-schema-2026-08-13" ]; then
                echo "Issue #166 Phase A requires the exact audited on-demand backup" >&2
                exit 1
              fi
              if [ "$ISSUE_166_EXPECTED_LEDGER" != "items=281,cardId=0,bundleId=153" ]; then
                echo "Issue #166 Phase A requires the exact groomed and reconciled ledger" >&2
                exit 1
              fi
              if [ "$ISSUE_166_CONFIRMATION" != "quiesce-dataops-v1-tasks-and-arm-delete-policy" ]; then
                echo "Issue #166 Phase A operator confirmation does not match" >&2
                exit 1
              fi
              ;;
            issue-166-phase-b)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Issue #166 Phase B requires an explicit manual dispatch of main" >&2
                exit 1
              fi
              if ! [[ "$ISSUE_166_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$ISSUE_166_COMMIT" != "$GITHUB_SHA" ]; then
                echo "Issue #166 Phase B commit must exactly match the dispatched commit" >&2
                exit 1
              fi
              if [ "$ISSUE_166_BACKUP_NAME" != "dataops-v1-tasks-pre-card-schema-2026-08-13" ]; then
                echo "Issue #166 Phase B requires the exact audited on-demand backup" >&2
                exit 1
              fi
              if [ "$ISSUE_166_EXPECTED_LEDGER" != "items=281,cardId=0,bundleId=153" ]; then
                echo "Issue #166 Phase B requires the exact groomed and reconciled ledger" >&2
                exit 1
              fi
              if [ "$ISSUE_166_CONFIRMATION" != "remove-proven-phase-a-dataops-v1-tasks" ]; then
                echo "Issue #166 Phase B operator confirmation does not match" >&2
                exit 1
              fi
              ;;
            issue-166-phase-c)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Issue #166 Phase C requires an explicit manual dispatch of main" >&2
                exit 1
              fi
              if ! [[ "$ISSUE_166_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$ISSUE_166_COMMIT" != "$GITHUB_SHA" ]; then
                echo "Issue #166 Phase C commit must exactly match the dispatched commit" >&2
                exit 1
              fi
              if [ "$ISSUE_166_BACKUP_NAME" != "dataops-v1-tasks-pre-card-schema-2026-08-13" ]; then
                echo "Issue #166 Phase C requires the exact audited on-demand backup" >&2
                exit 1
              fi
              if [ "$ISSUE_166_EXPECTED_LEDGER" != "items=281,cardId=0,bundleId=153" ]; then
                echo "Issue #166 Phase C requires the exact groomed and reconciled ledger" >&2
                exit 1
              fi
              if [ "$ISSUE_166_CONFIRMATION" != "create-empty-final-dataops-v1-tasks" ]; then
                echo "Issue #166 Phase C operator confirmation does not match" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown deployment mode: $DEPLOYMENT_MODE" >&2
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: dataops-v1-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: "Verify issue #166 Phase A preflight and exact backup"
        if: env.DEPLOYMENT_MODE == 'issue-166-phase-a'
        id: issue166_preflight
        run: |
          set -euo pipefail
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          case "$stack_status" in
            UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
            *)
              echo "Issue #166 Phase A requires a healthy completed dataops-v1 stack" >&2
              exit 1
              ;;
          esac

          table_name="$(aws cloudformation describe-stack-resource \
            --stack-name dataops-v1 \
            --logical-resource-id DataOpsTasksTable \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          if [ "$table_name" != "dataops-v1-tasks" ]; then
            echo "Issue #166 Phase A refuses an unexpected Tasks table identity" >&2
            exit 1
          fi

          table_json="$(aws dynamodb describe-table --table-name "$table_name" --output json)"
          if ! jq -e '
            .Table.TableStatus == "ACTIVE"
            and ([.Table.GlobalSecondaryIndexes[].IndexStatus] | all(. == "ACTIVE"))
            and ([.Table.GlobalSecondaryIndexes[].IndexName] | sort == ["GSI-Bundle", "GSI-Card", "GSI-Date", "GSI-Status"])
          ' <<<"$table_json" >/dev/null; then
            echo "Issue #166 Phase A requires the exact active transitional table/index state" >&2
            exit 1
          fi
          table_arn="$(jq -r '.Table.TableArn' <<<"$table_json")"
          table_id="$(jq -r '.Table.TableId' <<<"$table_json")"
          if [ "$table_id" != "b4e83537-7cf6-41cb-a281-8a52f678b1a3" ]; then
            echo "Issue #166 Phase A refuses an unexpected Tasks table ID" >&2
            exit 1
          fi
          if [ "$(aws dynamodb describe-continuous-backups \
            --table-name "$table_name" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text)" != "ENABLED" ]; then
            echo "Issue #166 Phase A requires PITR to be enabled" >&2
            exit 1
          fi

          backups_json="$(aws dynamodb list-backups \
            --table-name "$table_name" \
            --backup-type USER \
            --output json)"
          backup_matches="$(jq --arg name "$ISSUE_166_BACKUP_NAME" \
            '[.BackupSummaries[] | select(.BackupName == $name)]' <<<"$backups_json")"
          if [ "$(jq 'length' <<<"$backup_matches")" -ne 1 ]; then
            echo "Issue #166 Phase A requires exactly one matching on-demand backup" >&2
            exit 1
          fi
          backup_arn="$(jq -r '.[0].BackupArn' <<<"$backup_matches")"
          backup_json="$(aws dynamodb describe-backup --backup-arn "$backup_arn" --output json)"
          if ! jq -e \
            --arg backup "$ISSUE_166_BACKUP_NAME" \
            --arg table "$table_name" \
            --arg tableArn "$table_arn" \
            --arg tableId "$table_id" '
            .BackupDescription.BackupDetails.BackupName == $backup
            and .BackupDescription.BackupDetails.BackupStatus == "AVAILABLE"
            and .BackupDescription.BackupDetails.BackupType == "USER"
            and .BackupDescription.BackupDetails.BackupCreationDateTime != null
            and .BackupDescription.BackupDetails.BackupSizeBytes > 0
            and .BackupDescription.SourceTableDetails.TableName == $table
            and .BackupDescription.SourceTableDetails.TableArn == $tableArn
            and .BackupDescription.SourceTableDetails.TableId == $tableId
            and .BackupDescription.SourceTableDetails.ItemCount == 281
            and .BackupDescription.SourceTableFeatureDetails.SSEDescription.Status == "ENABLED"
          ' <<<"$backup_json" >/dev/null; then
            echo "Issue #166 Phase A backup is not the exact AVAILABLE encrypted source snapshot" >&2
            exit 1
          fi

          item_count=0
          card_count=0
          bundle_count=0
          start_key=""
          while true; do
            scan_args=(dynamodb scan --table-name "$table_name" --consistent-read --no-paginate \
              --projection-expression '#card,#bundle' \
              --expression-attribute-names '{"#card":"cardId","#bundle":"bundleId"}' \
              --output json)
            if [ -n "$start_key" ]; then
              scan_args+=(--exclusive-start-key "$start_key")
            fi
            page="$(aws "${scan_args[@]}")"
            item_count=$((item_count + $(jq '.ScannedCount' <<<"$page")))
            card_count=$((card_count + $(jq '[.Items[] | select(has("cardId"))] | length' <<<"$page")))
            bundle_count=$((bundle_count + $(jq '[.Items[] | select(has("bundleId"))] | length' <<<"$page")))
            start_key="$(jq -c 'if ((.LastEvaluatedKey // {}) | length) > 0 then .LastEvaluatedKey else empty end' <<<"$page")"
            [ -n "$start_key" ] || break
          done
          if [ "$item_count:$card_count:$bundle_count" != "281:0:153" ]; then
            echo "Issue #166 Phase A observed ledger differs from the reconciled ledger" >&2
            exit 1
          fi

          echo "table_name=$table_name" >> "$GITHUB_OUTPUT"
          echo "Issue #166 Phase A preflight passed for the exact stack table, ledger, and AVAILABLE backup."

      - name: "Verify issue #166 Phase B exact recovery point and quiescence"
        if: env.DEPLOYMENT_MODE == 'issue-166-phase-b'
        run: |
          set -euo pipefail
          if [ "$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query 'Stacks[0].StackStatus' \
            --output text)" != "UPDATE_COMPLETE" ]; then
            echo "Issue #166 Phase B requires dataops-v1 to be UPDATE_COMPLETE" >&2
            exit 1
          fi

          table_name="$(aws cloudformation describe-stack-resource \
            --stack-name dataops-v1 \
            --logical-resource-id DataOpsTasksTable \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          if [ "$table_name" != "dataops-v1-tasks" ]; then
            echo "Issue #166 Phase B refuses an unexpected Tasks table identity" >&2
            exit 1
          fi
          table_json="$(aws dynamodb describe-table --table-name "$table_name" --output json)"
          if ! jq -e '
            .Table.TableStatus == "ACTIVE"
            and .Table.TableId == "b4e83537-7cf6-41cb-a281-8a52f678b1a3"
            and ([.Table.AttributeDefinitions[].AttributeName] | sort == ["PK", "SK", "bundleId", "cardId", "date", "status"])
            and ([.Table.GlobalSecondaryIndexes[].IndexStatus] | all(. == "ACTIVE"))
            and ([.Table.GlobalSecondaryIndexes[].IndexName] | sort == ["GSI-Bundle", "GSI-Card", "GSI-Date", "GSI-Status"])
          ' <<<"$table_json" >/dev/null; then
            echo "Issue #166 Phase B requires the exact active transitional table" >&2
            exit 1
          fi
          table_arn="$(jq -r '.Table.TableArn' <<<"$table_json")"
          if [ "$(aws dynamodb describe-continuous-backups \
            --table-name "$table_name" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text)" != "ENABLED" ]; then
            echo "Issue #166 Phase B requires PITR to remain enabled" >&2
            exit 1
          fi

          backups_json="$(aws dynamodb list-backups \
            --table-name "$table_name" \
            --backup-type USER \
            --output json)"
          backup_matches="$(jq --arg name "$ISSUE_166_BACKUP_NAME" \
            '[.BackupSummaries[] | select(.BackupName == $name)]' <<<"$backups_json")"
          if [ "$(jq 'length' <<<"$backup_matches")" -ne 1 ]; then
            echo "Issue #166 Phase B requires exactly one matching on-demand backup" >&2
            exit 1
          fi
          backup_arn="$(jq -r '.[0].BackupArn' <<<"$backup_matches")"
          backup_json="$(aws dynamodb describe-backup --backup-arn "$backup_arn" --output json)"
          if ! jq -e \
            --arg backup "$ISSUE_166_BACKUP_NAME" \
            --arg table "$table_name" \
            --arg tableArn "$table_arn" '
            .BackupDescription.BackupDetails.BackupName == $backup
            and .BackupDescription.BackupDetails.BackupStatus == "AVAILABLE"
            and .BackupDescription.BackupDetails.BackupType == "USER"
            and .BackupDescription.BackupDetails.BackupCreationDateTime != null
            and .BackupDescription.BackupDetails.BackupSizeBytes > 0
            and .BackupDescription.SourceTableDetails.TableName == $table
            and .BackupDescription.SourceTableDetails.TableArn == $tableArn
            and .BackupDescription.SourceTableDetails.TableId == "b4e83537-7cf6-41cb-a281-8a52f678b1a3"
            and .BackupDescription.SourceTableDetails.ItemCount == 281
            and .BackupDescription.SourceTableFeatureDetails.SSEDescription.Status == "ENABLED"
          ' <<<"$backup_json" >/dev/null; then
            echo "Issue #166 Phase B backup is not the exact AVAILABLE encrypted source snapshot" >&2
            exit 1
          fi

          for logical_id in BackendFunction ConversationalExecutionWorkerFunction; do
            function_name="$(aws cloudformation describe-stack-resource \
              --stack-name dataops-v1 \
              --logical-resource-id "$logical_id" \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text)"
            if [ "$(aws lambda get-function-concurrency \
              --function-name "$function_name" \
              --query 'ReservedConcurrentExecutions' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B requires zero reserved concurrency for $logical_id" >&2
              exit 1
            fi
            function_arn="$(aws lambda get-function \
              --function-name "$function_name" \
              --query 'Configuration.FunctionArn' \
              --output text)"
            if [ "$(aws events list-rule-names-by-target \
              --target-arn "$function_arn" \
              --query 'RuleNames | length(@)' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B refuses an EventBridge writer for $logical_id" >&2
              exit 1
            fi
            if [ "$(aws lambda list-event-source-mappings \
              --function-name "$function_name" \
              --query 'EventSourceMappings[?State==`Enabled` || State==`Enabling` || State==`Creating`] | length(@)' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B refuses an active event source for $logical_id" >&2
              exit 1
            fi
          done

          # Re-prove the Phase A drain bound in this destructive dispatch rather
          # than trusting elapsed time or a prior workflow run.
          sleep 35
          item_count=0
          card_count=0
          bundle_count=0
          start_key=""
          while true; do
            scan_args=(dynamodb scan --table-name "$table_name" --consistent-read --no-paginate \
              --projection-expression '#card,#bundle' \
              --expression-attribute-names '{"#card":"cardId","#bundle":"bundleId"}' \
              --output json)
            if [ -n "$start_key" ]; then
              scan_args+=(--exclusive-start-key "$start_key")
            fi
            page="$(aws "${scan_args[@]}")"
            item_count=$((item_count + $(jq '.ScannedCount' <<<"$page")))
            card_count=$((card_count + $(jq '[.Items[] | select(has("cardId"))] | length' <<<"$page")))
            bundle_count=$((bundle_count + $(jq '[.Items[] | select(has("bundleId"))] | length' <<<"$page")))
            start_key="$(jq -c 'if ((.LastEvaluatedKey // {}) | length) > 0 then .LastEvaluatedKey else empty end' <<<"$page")"
            [ -n "$start_key" ] || break
          done
          if [ "$item_count:$card_count:$bundle_count" != "281:0:153" ]; then
            echo "Issue #166 Phase B observed ledger differs from the approved disposable ledger" >&2
            exit 1
          fi
          echo "Issue #166 Phase B preflight proved the exact backup, table identity, ledger, and drained writers."

      - name: "Verify issue #166 Phase C exact recovery point and Phase B absence"
        if: env.DEPLOYMENT_MODE == 'issue-166-phase-c'
        run: |
          set -euo pipefail
          if [ "$(aws cloudformation describe-stacks --stack-name dataops-v1 --query 'Stacks[0].StackStatus' --output text)" != "UPDATE_COMPLETE" ]; then
            echo "Issue #166 Phase C requires dataops-v1 to be UPDATE_COMPLETE" >&2
