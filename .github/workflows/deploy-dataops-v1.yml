            fi
            if [ "$(aws lambda list-event-source-mappings \
              --function-name "$function_name" \
              --query 'EventSourceMappings[?State==`Enabled` || State==`Enabling` || State==`Creating`] | length(@)' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase A left an event-source writer active for $logical_id" >&2
              exit 1
            fi
          done

          # Both targeted functions have a maximum configured timeout of 30 seconds.
          # Waiting beyond that bound proves pre-update executions have drained while
          # the zero-concurrency reservation prevents replacements from starting.
          sleep 35

          item_count=0
          card_count=0
          bundle_count=0
          start_key=""
          while true; do
            scan_args=(dynamodb scan --table-name "$table_name" --consistent-read --no-paginate \
              --projection-expression '#card,#bundle' \
              --expression-attribute-names '{"#card":"cardId","#bundle":"bundleId"}' \
              --output json)
            if [ -n "$start_key" ]; then
              scan_args+=(--exclusive-start-key "$start_key")
            fi
            page="$(aws "${scan_args[@]}")"
            item_count=$((item_count + $(jq '.ScannedCount' <<<"$page")))
            card_count=$((card_count + $(jq '[.Items[] | select(has("cardId"))] | length' <<<"$page")))
            bundle_count=$((bundle_count + $(jq '[.Items[] | select(has("bundleId"))] | length' <<<"$page")))
            start_key="$(jq -c 'if ((.LastEvaluatedKey // {}) | length) > 0 then .LastEvaluatedKey else empty end' <<<"$page")"
            [ -n "$start_key" ] || break
          done
          if [ "$item_count:$card_count:$bundle_count" != "281:0:153" ]; then
            echo "Issue #166 Phase A changed the audited table ledger" >&2
            exit 1
          fi
          echo "Issue #166 Phase A is bounded at quiescence and Delete-policy arming; the original table remains unchanged."

      - name: "Assert bounded issue #166 Phase B result"
        if: env.DEPLOYMENT_MODE == 'issue-166-phase-b'
        run: |
          set -euo pipefail
          if [ "$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query 'Stacks[0].StackStatus' \
            --output text)" != "UPDATE_COMPLETE" ]; then
            echo "Issue #166 Phase B stack update did not reach UPDATE_COMPLETE" >&2
            exit 1
          fi

          processed_template="$RUNNER_TEMP/dataops-issue-166-phase-b-processed-template.json"
          aws cloudformation get-template \
            --stack-name dataops-v1 \
            --template-stage Processed \
            --query TemplateBody \
            --output json > "$processed_template"
          node --input-type=module - "$processed_template" <<'JS'
          import { readFileSync } from 'node:fs';

          const encodedTemplate = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const template = typeof encodedTemplate === 'string'
            ? JSON.parse(encodedTemplate)
            : encodedTemplate;
          if (!template || typeof template !== 'object' || Array.isArray(template)) {
            throw new Error('Processed CloudFormation template must be a JSON object');
          }
          const marker = template?.Metadata?.DataOpsIssue166Cutover;
          const resources = template?.Resources ?? {};
          const outputs = template?.Outputs ?? {};
          const backend = resources.BackendFunction;
          const worker = resources.ConversationalExecutionWorkerFunction;
          const exactPhaseB = JSON.stringify(marker) === JSON.stringify({ Issue: 166, Phase: 'B' })
            && resources.DataOpsTasksTable === undefined
            && outputs.DataOpsTasksTableName === undefined
            && backend?.Properties?.ReservedConcurrentExecutions === 0
            && worker?.Properties?.ReservedConcurrentExecutions === 0;
          if (!exactPhaseB || JSON.stringify(template).includes('DataOpsTasksTable')) {
            throw new Error('Issue #166 Phase B processed template retained the table, dependency, output, or lost quiescence');
          }
          JS

          stack_resource_stdout="$RUNNER_TEMP/dataops-issue-166-phase-b-stack-resource.out"
          stack_resource_stderr="$RUNNER_TEMP/dataops-issue-166-phase-b-stack-resource.err"
          if aws cloudformation describe-stack-resource \
            --stack-name dataops-v1 \
            --logical-resource-id DataOpsTasksTable \
            >"$stack_resource_stdout" 2>"$stack_resource_stderr"; then
            echo "Issue #166 Phase B stack still owns DataOpsTasksTable" >&2
            exit 1
          fi
          if ! grep -Fq '(ValidationError)' "$stack_resource_stderr" \
            || ! grep -Fq 'does not exist' "$stack_resource_stderr"; then
            echo "Issue #166 Phase B could not prove the logical resource is absent" >&2
            exit 1
          fi

          describe_stdout="$RUNNER_TEMP/dataops-issue-166-phase-b-describe-table.out"
          describe_stderr="$RUNNER_TEMP/dataops-issue-166-phase-b-describe-table.err"
          if aws dynamodb describe-table \
            --table-name dataops-v1-tasks \
            >"$describe_stdout" 2>"$describe_stderr"; then
            echo "Issue #166 Phase B fixed Tasks table name still exists" >&2
            exit 1
          fi
          if ! grep -Fq '(ResourceNotFoundException)' "$describe_stderr"; then
            echo "Issue #166 Phase B did not receive the required DynamoDB ResourceNotFoundException" >&2
            exit 1
          fi

          for logical_id in BackendFunction ConversationalExecutionWorkerFunction; do
            function_name="$(aws cloudformation describe-stack-resource \
              --stack-name dataops-v1 \
              --logical-resource-id "$logical_id" \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text)"
            if [ "$(aws lambda get-function-concurrency \
              --function-name "$function_name" \
              --query 'ReservedConcurrentExecutions' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B lost zero concurrency for $logical_id" >&2
              exit 1
            fi
            function_arn="$(aws lambda get-function \
              --function-name "$function_name" \
              --query 'Configuration.FunctionArn' \
              --output text)"
            if [ "$(aws events list-rule-names-by-target \
              --target-arn "$function_arn" \
              --query 'RuleNames | length(@)' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B restored an EventBridge writer for $logical_id" >&2
              exit 1
            fi
            if [ "$(aws lambda list-event-source-mappings \
              --function-name "$function_name" \
              --query 'EventSourceMappings[?State==`Enabled` || State==`Enabling` || State==`Creating`] | length(@)' \
              --output text)" != "0" ]; then
              echo "Issue #166 Phase B restored an event-source writer for $logical_id" >&2
              exit 1
            fi
          done
          echo "Issue #166 Phase B removed the old stack resource and fixed table name while writers remain quiesced."

      - name: "Assert bounded issue #166 Phase C result"
        if: env.DEPLOYMENT_MODE == 'issue-166-phase-c'
        run: |
          set -euo pipefail
          stack_json="$(aws cloudformation describe-stacks --stack-name dataops-v1 --output json)"
          if [ "$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")" != "UPDATE_COMPLETE" ]; then
            echo "Issue #166 Phase C stack update did not reach UPDATE_COMPLETE" >&2
            exit 1
          fi
          if [ "$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey == "DataOpsTasksTableName") | .OutputValue' <<<"$stack_json")" != "dataops-v1-tasks" ]; then
            echo "Issue #166 Phase C did not restore the canonical Tasks output" >&2
            exit 1
          fi

          processed_template="$RUNNER_TEMP/dataops-issue-166-phase-c-processed-template.json"
          aws cloudformation get-template --stack-name dataops-v1 --template-stage Processed \
            --query TemplateBody --output json > "$processed_template"
          node --input-type=module - "$processed_template" <<'JS'
          import { readFileSync } from 'node:fs';
          const encodedTemplate = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const template = typeof encodedTemplate === 'string'
            ? JSON.parse(encodedTemplate)
            : encodedTemplate;
          if (!template || typeof template !== 'object' || Array.isArray(template)) {
            throw new Error('Processed CloudFormation template must be a JSON object');
          }
          const resources = template?.Resources ?? {};
          const tasks = resources.DataOpsTasksTable;
          const backend = resources.BackendFunction;
          const worker = resources.ConversationalExecutionWorkerFunction;
          const backendRole = resources.BackendFunctionRole;
          const workerRole = resources.ConversationalExecutionWorkerFunctionRole;
          const attributes = (tasks?.Properties?.AttributeDefinitions ?? []).map(({ AttributeName }) => AttributeName).sort();
          const indexes = (tasks?.Properties?.GlobalSecondaryIndexes ?? []).map(({ IndexName }) => IndexName).sort();
          const valid = JSON.stringify(template?.Metadata?.DataOpsIssue166Cutover) === JSON.stringify({ Issue: 166, Phase: 'C' })
            && tasks?.Type === 'AWS::DynamoDB::Table'
            && tasks?.DeletionPolicy === 'Retain' && tasks?.UpdateReplacePolicy === 'Retain'
            && JSON.stringify(tasks?.Properties?.TableName)
              === JSON.stringify({ 'Fn::Sub': '${AWS::StackName}-tasks' })
            && JSON.stringify(attributes) === JSON.stringify(['PK', 'SK', 'cardId', 'date', 'status'])
            && JSON.stringify(indexes) === JSON.stringify(['GSI-Card', 'GSI-Date', 'GSI-Status'])
            && backend?.Properties?.ReservedConcurrentExecutions === 0 && backend?.Properties?.Events === undefined
            && worker?.Properties?.ReservedConcurrentExecutions === 0 && worker?.Properties?.Events === undefined
            && JSON.stringify(worker?.Properties?.Environment?.Variables?.DATAOPS_TASKS_TABLE)
              === JSON.stringify({ Ref: 'DataOpsTasksTable' })
            && backendRole?.Type === 'AWS::IAM::Role'
            && JSON.stringify(backendRole.Properties?.Policies).includes('DataOpsTasksTable')
            && workerRole?.Type === 'AWS::IAM::Role'
            && JSON.stringify(workerRole.Properties?.Policies).includes('DataOpsTasksTable');
          if (!valid || JSON.stringify(template).includes('bundleId') || JSON.stringify(template).includes('GSI-Bundle')) {
            throw new Error('Issue #166 Phase C processed template is not the exact final schema with closed writers');
          }
          JS

          table_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
            --logical-resource-id DataOpsTasksTable --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          if [ "$table_name" != "dataops-v1-tasks" ]; then
            echo "Issue #166 Phase C stack does not own the canonical fixed table name" >&2
            exit 1
          fi
          table_json="$(aws dynamodb describe-table --table-name "$table_name" --output json)"
          if ! jq -e '
            .Table.TableStatus == "ACTIVE"
            and .Table.TableId != "b4e83537-7cf6-41cb-a281-8a52f678b1a3"
            and .Table.BillingModeSummary.BillingMode == "PAY_PER_REQUEST"
            and .Table.SSEDescription.Status == "ENABLED"
            and ([.Table.AttributeDefinitions[].AttributeName] | sort == ["PK", "SK", "cardId", "date", "status"])
            and .Table.KeySchema == [{"AttributeName":"PK","KeyType":"HASH"},{"AttributeName":"SK","KeyType":"RANGE"}]
            and ([.Table.GlobalSecondaryIndexes[].IndexStatus] | all(. == "ACTIVE"))
            and ([.Table.GlobalSecondaryIndexes[].IndexName] | sort == ["GSI-Card", "GSI-Date", "GSI-Status"])
            and ([.Table.GlobalSecondaryIndexes[] | {IndexName,KeySchema,Projection}] | sort_by(.IndexName)) == ([
              {IndexName:"GSI-Card",KeySchema:[{AttributeName:"cardId",KeyType:"HASH"},{AttributeName:"date",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}},
              {IndexName:"GSI-Date",KeySchema:[{AttributeName:"date",KeyType:"HASH"},{AttributeName:"status",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}},
              {IndexName:"GSI-Status",KeySchema:[{AttributeName:"status",KeyType:"HASH"},{AttributeName:"date",KeyType:"RANGE"}],Projection:{ProjectionType:"ALL"}}
            ] | sort_by(.IndexName))
          ' <<<"$table_json" >/dev/null; then
            echo "Issue #166 Phase C recreated table is not the exact active final schema" >&2
            exit 1
          fi
          table_arn="$(jq -r '.Table.TableArn' <<<"$table_json")"
          if [ "$(aws dynamodb describe-continuous-backups --table-name "$table_name" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' --output text)" != "ENABLED" ]; then
            echo "Issue #166 Phase C requires PITR on the recreated table" >&2
            exit 1
          fi
          tags_json="$(aws dynamodb list-tags-of-resource --resource-arn "$table_arn" --output json)"
          if ! jq -e '([.Tags[] | select(.Key == "Project" and .Value == "DataOps")] | length) == 1
            and ([.Tags[] | select(.Key == "App" and .Value == "DataOpsV1")] | length) == 1
            and ([.Tags[] | select(.Key == "DataClass" and .Value == "ExecutionState")] | length) == 1' <<<"$tags_json" >/dev/null; then
            echo "Issue #166 Phase C recreated table is missing exact ownership tags" >&2
            exit 1
          fi
          if [ "$(aws dynamodb scan --table-name "$table_name" --consistent-read --select COUNT \
            --query 'Count' --output text)" != "0" ]; then
            echo "Issue #166 Phase C recreated table is not empty" >&2
            exit 1
          fi

          for logical_id in BackendFunction ConversationalExecutionWorkerFunction; do
            function_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
              --logical-resource-id "$logical_id" --query 'StackResourceDetail.PhysicalResourceId' --output text)"
            if [ "$(aws lambda get-function-concurrency --function-name "$function_name" \
              --query 'ReservedConcurrentExecutions' --output text)" != "0" ]; then
              echo "Issue #166 Phase C lost zero concurrency for $logical_id" >&2
              exit 1
            fi
            function_arn="$(aws lambda get-function --function-name "$function_name" --query 'Configuration.FunctionArn' --output text)"
            if [ "$(aws events list-rule-names-by-target --target-arn "$function_arn" --query 'RuleNames | length(@)' --output text)" != "0" ] \
              || [ "$(aws lambda list-event-source-mappings --function-name "$function_name" \
              --query 'EventSourceMappings[?State==`Enabled` || State==`Enabling` || State==`Creating`] | length(@)' --output text)" != "0" ]; then
              echo "Issue #166 Phase C restored a writer trigger for $logical_id" >&2
              exit 1
            fi
          done
          worker_name="$(aws cloudformation describe-stack-resource --stack-name dataops-v1 \
            --logical-resource-id ConversationalExecutionWorkerFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          if [ "$(aws lambda get-function-configuration --function-name "$worker_name" \
            --query 'Environment.Variables.DATAOPS_TASKS_TABLE' --output text)" != "$table_name" ]; then
            echo "Issue #166 Phase C worker environment does not resolve to the recreated table" >&2
            exit 1
          fi
          echo "Issue #166 Phase C created the exact empty final table while all writers remain closed."

      - name: Seed runtime users and recurring configs
        if: env.DEPLOYMENT_MODE == 'normal'
        working-directory: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          export DATAOPS_TASKS_TABLE="$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='DataOpsTasksTableName'].OutputValue" \
            --output text)"
          export DATAOPS_USERS_TABLE="$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='DataOpsUsersTableName'].OutputValue" \
            --output text)"
          npm exec -- tsx scripts/seed-users.ts

          backend_function="$(aws cloudformation describe-stack-resource \
            --stack-name dataops-v1 \
            --logical-resource-id BackendFunction \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text)"
          sync_error="$(aws lambda invoke \
            --function-name "$backend_function" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"source":"dataops.deploy","detail-type":"Template Sync","detail":{"dataopsAction":"sync-templates"}}' \
            --query FunctionError \
            --output text \
            /tmp/dataops-template-sync.json)"
          if [ "$sync_error" != "None" ]; then
            echo "Git-authored template projection failed inside the deployed Lambda" >&2
            exit 1
          fi
          if ! jq -e '.statusCode == 200 and (.body | fromjson | .total == 11)' \
            /tmp/dataops-template-sync.json >/dev/null; then
            echo "Git-authored template projection did not confirm exactly 11 definitions" >&2
            exit 1
          fi
          echo "Projected 11 Git-authored workflow templates."

          npm exec -- tsx scripts/seed-recurring.ts

      - name: Smoke test deployed single-origin backend
        if: env.DEPLOYMENT_MODE == 'normal'
        run: |
          backend_url="$(aws cloudformation describe-stacks \
            --stack-name dataops-v1 \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" \
            --output text)"
          # The Function URL output ends with a trailing slash; strip it so we hit
          # "/" and "/login" instead of malformed double-slash paths ("//", "//login").
          backend_url="${backend_url%/}"
          # /login redirects to the shared Cognito authorize endpoint and root redirects locally.
          # The Function URL event normalization in handler.ts must work for this.
          # Retry a few times: immediately after a stack update the Function URL can
          # briefly return a cold-start/propagation blip before the new code settles.
          code=""
          login_code=""
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$backend_url/")
            login_code=$(curl -sS -o /dev/null -w "%{http_code}" "$backend_url/login")
            if [ "$code" = "302" ] && [ "$login_code" = "302" ]; then
              echo "Backend smoke OK on attempt $attempt: root=$code login=$login_code"
              exit 0
            fi
            echo "Smoke attempt $attempt: root=$code login=$login_code (retrying)"
            sleep 10
          done
          echo "Backend smoke test failed after retries: root expected 302 got $code; /login expected 302 got $login_code"
          exit 1
