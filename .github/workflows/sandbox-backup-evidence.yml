name: Sandbox Backup Evidence (read-only)

# Dispatch-only, read-only proof under the CI OIDC role. Permission failures
# and missing alarms fail this job; a green run means evidence was collected.
# No snapshots, tokens, or application data are printed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sandbox-backup-evidence.yml

permissions:
  contents: read

concurrency:
  group: sandbox-backup-evidence
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::817685572750:role/dataops-github-actions-deploy

jobs:
  validate:
    name: Validate backup evidence workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check workflow syntax and shell
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 .github/workflows/sandbox-backup-evidence.yml

  evidence:
    if: github.event_name == 'workflow_dispatch'
    name: Read alarm state and worker config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sandbox-backup-evidence
          aws-region: ${{ env.AWS_REGION }}

      - name: Read each backup and scheduled-run alarm
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for suffix in knowledge-backup-stale knowledge-repo-backup-stale knowledge-worker-failure knowledge-mirror-stale knowledge-mirror-failed recurring-cron-pass-missed recurring-cron-failure recurring-cron-errors; do
            name="dataops-v1-$suffix"
            if ! aws cloudwatch describe-alarms --alarm-names "$name" \
              --query 'MetricAlarms' --output json > "$RUNNER_TEMP/$suffix.json"; then
              failed=1
              continue
            fi
            cat "$RUNNER_TEMP/$suffix.json"
            jq -e 'length == 1 and .[0].ActionsEnabled == true and (.[0].AlarmActions | length > 0)' \
              "$RUNNER_TEMP/$suffix.json" >/dev/null || failed=1
          done
          exit "$failed"

      - name: Read alarm topic subscriptions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for topic in dataops-v1-conversational-rollout-alarms dapier-AlarmTopic-6LjEWSJwA6Ya; do
            echo "Topic: $topic"
            aws sns list-subscriptions-by-topic \
              --topic-arn "arn:aws:sns:$AWS_REGION:817685572750:$topic" \
              --query 'Subscriptions[].{Protocol:Protocol,Endpoint:Endpoint,SubscriptionArn:SubscriptionArn}' \
              --output json || failed=1
          done
          exit "$failed"

      - name: Prove the backup freshness alarms reach a subscriber
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # Success=1 per daily backup/check; alarm when the 2-day sum is <1 or missing.
          for suffix in knowledge-backup-stale knowledge-repo-backup-stale; do
            alarm="$RUNNER_TEMP/$suffix.json"
            jq -e '.[0] | .Namespace == "DataOps/Knowledge" and .MetricName == "Success"
              and .Threshold == 1 and .ComparisonOperator == "LessThanThreshold"
              and .TreatMissingData == "breaching"' "$alarm" >/dev/null
            for topic in $(jq -r '.[0].AlarmActions[]' "$alarm"); do
              confirmed=$(aws sns list-subscriptions-by-topic --topic-arn "$topic" --output json \
                | jq '[.Subscriptions[] | select(.SubscriptionArn != "PendingConfirmation")] | length')
              echo "$suffix -> $topic confirmed subscriptions: $confirmed"
              [ "$confirmed" -ge 1 ]
            done
          done

      - name: Read actual knowledge success datapoints
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for job in knowledge-backup knowledge-mirror knowledge-repo-backup; do
            echo "Job: $job"
            aws cloudwatch get-metric-statistics \
              --namespace DataOps/Knowledge --metric-name Success \
              --dimensions "Name=Job,Value=$job" \
              --start-time "$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
              --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --period 3600 --statistics Sum --output json || failed=1
          done
          exit "$failed"
