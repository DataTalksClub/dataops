name: Validate Backend Browser E2E
run-name: Browser E2E @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-backend-e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/validate-backend-e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# main must always get a completed run. Many sessions push to main, so a
# cancelling group never finished there. Without cancel-in-progress the
# running main build finishes, and GitHub keeps only the newest pending run
# behind it: at most one running and one waiting, which batches the pushes
# in between. Pull request branches still cancel superseded runs.
concurrency:
  group: dataops-backend-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-e2e:
    name: Validate backend browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DTC_AUTH_HOME: ${{ github.workspace }}/.tmp/shared-auth

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out shared CLI device-login loop
        uses: actions/checkout@v6
        with:
          repository: DataTalksClub/auth
          ref: d286b5cc24fa37a6a6f1e312c770a46bc248063d
          path: .tmp/shared-auth

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node workspace dependencies
        run: npm ci

      # Runner apt mirrors and DNS fail transiently ("Temporary failure
      # resolving archive.ubuntu.com", then "no installation candidate").
      # apt retries each fetch, and the whole install (apt-get update, the
      # OS packages, and the browser download) is retried with backoff.
      # Only this setup step is retried; the E2E step below runs once.
      - name: Install backend Playwright Chromium
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          delays=(0 15 30 60 120)
          for attempt in "${!delays[@]}"; do
            if (( attempt > 0 )); then
              echo "::warning::Playwright install attempt ${attempt} failed; retrying in ${delays[$attempt]}s"
              sleep "${delays[$attempt]}"
            fi
            if npm exec --workspace dataops-backend -- playwright install --with-deps chromium; then
              exit 0
            fi
          done
          echo "::error::Playwright install failed after ${#delays[@]} attempts"
          exit 1

      - name: Run backend Playwright E2E
        run: npm --prefix backend run test:e2e

      - name: Record tested commit
        if: always()
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Browser E2E: ${JOB_STATUS}"
            echo
            echo "Tested commit: \`${TESTED_SHA}\` (${GITHUB_REF_NAME}, ${GITHUB_EVENT_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-playwright-artifacts
          path: |
            backend/playwright-report/
            backend/test-results/
          if-no-files-found: ignore
          retention-days: 7
