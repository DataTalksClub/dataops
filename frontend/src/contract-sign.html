<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Sign your DataTalks.Club sponsorship agreement</title>
  <script>
    (() => { let theme; try { theme = localStorage.getItem('dakit-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; })();
  </script>
  <link rel="stylesheet" href="/src/dakit/dakit.css">
</head>
<body class="dk-auth-page sponsor-doc-page">
  <header class="dk-auth-page__bar">
    <a class="dk-brand" href="/"><span class="dk-brand__name">DataTalks.Club · Sponsorship agreement</span></a>
    <span id="contract-sign-identity" class="dk-auth-page__identity" role="status">Checking your signing link…</span>
  </header>
  <main class="dk-auth-page__main sponsor-doc-page__main">
    <section id="contract-sign-root" class="sponsor-doc-shell" aria-label="Sponsorship agreement signature"></section>
  </main>
  <div id="dk-live" class="dk-visually-hidden" aria-live="polite"></div>
  <script type="module" src="/src/contract-sign-page.js"></script>
  <script>
    // If the module graph fails to load the page script never runs; say so and report it instead of waiting forever.
    setTimeout(() => {
      if (document.documentElement.dataset.pageReady) return;
      const identity = document.getElementById('contract-sign-identity');
      if (identity) identity.textContent = 'Could not load this page. Reload to try again. The DataTalks.Club team has been notified.';
      try {
        fetch('/api/client-errors', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({ surface: 'contract-sign', check: 'page-script-load', message: 'page script did not start within 10s', page: location.pathname }),
        }).catch(() => {});
      } catch {}
    }, 10000);
  </script>
</body>
</html>
