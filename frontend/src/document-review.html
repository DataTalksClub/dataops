<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Document review · DataTalks.Club</title>
  <link rel="stylesheet" href="/src/dakit/dakit.css">
</head>
<body>
  <main id="document-review-root" class="dk-stack" aria-label="Document review">Loading document…</main>
  <script type="module" src="/src/document-review-page.js"></script>
  <script>
    // If the module graph fails to load the page script never runs; say so and report it instead of waiting forever.
    setTimeout(() => {
      if (document.documentElement.dataset.pageReady) return;
      const identity = document.getElementById('document-review-root');
      if (identity) identity.textContent = 'Could not load this page. Reload to try again. The DataTalks.Club team has been notified.';
      try {
        fetch('/api/client-errors', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({ surface: 'document-review', check: 'page-script-load', message: 'page script did not start within 10s', page: location.pathname }),
        }).catch(() => {});
      } catch {}
    }, 10000);
  </script>
</body>
</html>
