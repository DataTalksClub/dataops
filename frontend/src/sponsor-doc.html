<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Materials Form · DataTalks.Club</title>
  <script>
    (() => { let theme; try { theme = localStorage.getItem('dakit-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; })();
  </script>
  <link rel="stylesheet" href="/src/dakit/dakit.css">
  <link rel="stylesheet" href="/src/styles/sponsor-docs.css">
</head>
<body class="dk-auth-page sponsor-doc-page">
  <header class="dk-auth-page__bar">
    <a class="dk-brand" href="/"><span class="dk-brand__name">DataTalks.Club · Materials</span></a>
    <span id="sponsor-doc-identity" class="dk-auth-page__identity" role="status">Checking access…</span>
  </header>
  <main class="dk-auth-page__main sponsor-doc-page__main">
    <section id="sponsor-doc-root" class="sponsor-doc-shell" aria-label="Guest and sponsor materials form"></section>
  </main>
  <div id="dk-live" class="dk-visually-hidden" aria-live="polite"></div>
  <script type="module" src="/src/sponsor-doc-page.js"></script>
</body>
</html>
